name: OrbitTrace paper hyperparameter robustness parallel v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/orbittrace-paper-hyperparam-parallel-v1.yml'
      - 'orbittrace-paper-hyperparam-parallel-v1/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  FROZEN_SRC: https://raw.githubusercontent.com/brandonlign/runner/499828f9e2b9b6f9ad2e2ceaa207a43beec82fd4/orbittrace_paper_hyperparam_robustness_v1

jobs:
  chunk:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Fetch exact frozen scientific source
        run: |
          set -euo pipefail
          mkdir -p orbittrace_paper_hyperparam_robustness_v1
          curl -L --fail --retry 3 "$FROZEN_SRC/PROTOCOL.md" -o orbittrace_paper_hyperparam_robustness_v1/PROTOCOL.md
          curl -L --fail --retry 3 "$FROZEN_SRC/canonical_2025_2026_ids.tsv" -o orbittrace_paper_hyperparam_robustness_v1/canonical_2025_2026_ids.tsv
          curl -L --fail --retry 3 "$FROZEN_SRC/run.py" -o orbittrace_paper_hyperparam_robustness_v1/run.py
          test "$(wc -l < orbittrace_paper_hyperparam_robustness_v1/canonical_2025_2026_ids.tsv)" -eq 63
          python -m py_compile orbittrace_paper_hyperparam_robustness_v1/run.py orbittrace-paper-hyperparam-parallel-v1/run_chunk.py

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            gmn-python-api==0.0.13 \
            numpy==1.23.5 \
            pandas==1.3.5 \
            scikit-learn==1.3.2 \
            requests==2.32.5

      - name: Run frozen chunk
        env:
          CHUNK: ${{ matrix.chunk }}
        run: |
          set -euo pipefail
          python orbittrace-paper-hyperparam-parallel-v1/run_chunk.py

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-hyperparam-chunk-${{ matrix.chunk }}
          path: chunk-output
          if-no-files-found: error

  aggregate:
    needs: chunk
    runs-on: ubuntu-22.04
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all successful chunks
        uses: actions/download-artifact@v4
        with:
          pattern: orbittrace-hyperparam-chunk-*
          path: all-chunks

      - name: Install aggregation dependency
        run: python -m pip install pandas==2.2.3

      - name: Aggregate and verify 41 frozen settings
        run: |
          set -euo pipefail
          python orbittrace-paper-hyperparam-parallel-v1/aggregate.py

      - name: Upload aggregate result
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-paper-hyperparam-robustness-parallel-v1
          path: aggregate-output
          if-no-files-found: error

      - name: Report aggregate result to PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BODY="$(cat aggregate-output/RESULT.md)"
          gh api "repos/$GH_REPO/issues/$PR/comments" -f body="$BODY"
