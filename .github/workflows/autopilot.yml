name: Telic autopilot

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Ignore the configured day, slot, and enabled flag for one run
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: telic-autopilot
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WORKER_REPOSITORY: brandonlign/remotion-worker
      AUTOPILOT_KILL_SWITCH: ${{ vars.AUTOPILOT_KILL_SWITCH }}

    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Check out private Telic source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ secrets.SOURCE_REPO_WRITE_TOKEN }}
          path: private-source
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: private-source/package-lock.json

      - name: Generate researched Telic job privately
        id: generate
        continue-on-error: true
        working-directory: private-source
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTOPILOT_FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          set +e
          : > "$RUNNER_TEMP/private-generation.log"
          code=1
          for attempt in 1 2 3; do
            printf 'Generation attempt %s started.\n' "$attempt" >> "$RUNNER_TEMP/private-generation.log"
            node scripts/autopilot/generate-job.mjs >>"$RUNNER_TEMP/private-generation.log" 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              echo "Private Telic generation completed."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "Private Telic generation failed after retries. Details were withheld from this public log."
          exit "$code"

      - name: Install private dependencies
        id: install
        if: steps.generate.outputs.generated == 'true'
        continue-on-error: true
        working-directory: private-source
        shell: bash
        run: |
          set +e
          : > "$RUNNER_TEMP/private-install.log"
          code=1
          for attempt in 1 2; do
            npm ci --no-audit --no-fund >>"$RUNNER_TEMP/private-install.log" 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              echo "Private dependencies installed."
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              sleep 20
            fi
          done
          echo "Private dependency installation failed. Details were withheld from this public log."
          exit "$code"

      - name: Validate private production source
        id: validate
        if: steps.generate.outputs.generated == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: private-source
        shell: bash
        run: |
          set +e
          {
            node --check scripts/autopilot/generate-job.mjs &&
            node --check scripts/autopilot/prepare-render.mjs &&
            node --check scripts/autopilot/dispatch-render.mjs &&
            node --check scripts/autopilot/wait-for-worker.mjs &&
            node --check scripts/autopilot/record-result.mjs &&
            npm run lint
          } >"$RUNNER_TEMP/private-validation.log" 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "Private production source validated."
          else
            echo "Private production validation failed. Details were withheld from this public log."
          fi
          exit "$code"

      - name: Upload private control-plane diagnostics
        if: >-
          always() &&
          (steps.generate.outcome == 'failure' ||
           steps.install.outcome == 'failure' ||
           steps.validate.outcome == 'failure')
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          JOB_ID: telic-control-${{ github.run_id }}
        run: |
          set +e
          diagnostic_dir="$RUNNER_TEMP/control-diagnostics"
          mkdir -p "$diagnostic_dir"
          for file in private-generation.log private-install.log private-validation.log; do
            if [ -f "$RUNNER_TEMP/$file" ]; then
              cp "$RUNNER_TEMP/$file" "$diagnostic_dir/$file"
            fi
          done
          node - "$diagnostic_dir/status.json" "$JOB_ID" <<'NODE'
          const fs = require("node:fs");
          const [outputPath, jobId] = process.argv.slice(2);
          fs.writeFileSync(outputPath, `${JSON.stringify({
            status: "control-plane-failed",
            jobId,
            completedAt: new Date().toISOString(),
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
          if bash scripts/upload-drive.sh "$diagnostic_dir" "$JOB_ID" >/dev/null 2>&1; then
            echo "Private control-plane diagnostics were uploaded to Drive."
          else
            echo "Private control-plane diagnostics could not be uploaded."
          fi
          exit 0

      - name: Stop after private control-plane failure
        if: >-
          always() &&
          (steps.generate.outcome == 'failure' ||
           steps.install.outcome == 'failure' ||
           steps.validate.outcome == 'failure')
        run: exit 1

      - name: Remove successful private setup logs
        if: steps.generate.outputs.generated == 'true' && steps.validate.outcome == 'success'
        run: rm -f "$RUNNER_TEMP/private-generation.log" "$RUNNER_TEMP/private-install.log" "$RUNNER_TEMP/private-validation.log"

      - name: Commit private production job
        if: steps.generate.outputs.generated == 'true' && steps.validate.outcome == 'success'
        id: source
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "telic-autopilot[bot]"
          git config user.email "telic-autopilot[bot]@users.noreply.github.com"
          git add automation/current automation/state.json
          git commit -m "Produce ${{ steps.generate.outputs.job_id }}" >/dev/null
          git push origin HEAD:main >/dev/null
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Private production job committed."

      - name: Dispatch render attempt 1
        if: steps.generate.outputs.generated == 'true' && steps.validate.outcome == 'success'
        id: dispatch1
        working-directory: private-source
        env:
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          JOB_ID: ${{ steps.generate.outputs.job_id }}
          REVISION: 1
        run: node scripts/autopilot/dispatch-render.mjs

      - name: Wait for render attempt 1
        if: steps.generate.outputs.generated == 'true' && steps.validate.outcome == 'success'
        id: wait1
        continue-on-error: true
        working-directory: private-source
        env:
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          WORKER_HEAD_SHA: ${{ steps.dispatch1.outputs.worker_head_sha }}
          WORKER_TIMEOUT_MINUTES: 70
        run: node scripts/autopilot/wait-for-worker.mjs

      - name: Dispatch render attempt 2
        if: steps.generate.outputs.generated == 'true' && steps.wait1.outcome == 'failure'
        id: dispatch2
        working-directory: private-source
        env:
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          JOB_ID: ${{ steps.generate.outputs.job_id }}
          REVISION: 2
        run: node scripts/autopilot/dispatch-render.mjs

      - name: Wait for render attempt 2
        if: steps.generate.outputs.generated == 'true' && steps.wait1.outcome == 'failure'
        id: wait2
        continue-on-error: true
        working-directory: private-source
        env:
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          WORKER_HEAD_SHA: ${{ steps.dispatch2.outputs.worker_head_sha }}
          WORKER_TIMEOUT_MINUTES: 70
        run: node scripts/autopilot/wait-for-worker.mjs

      - name: Record successful publication
        if: >-
          steps.generate.outputs.generated == 'true' &&
          (steps.wait1.outcome == 'success' || steps.wait2.outcome == 'success')
        working-directory: private-source
        env:
          JOB_ID: ${{ steps.generate.outputs.job_id }}
          JOB_RESULT: published
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ATTEMPT: ${{ steps.wait1.outcome == 'success' && '1' || '2' }}
        run: node scripts/autopilot/record-result.mjs

      - name: Record exhausted publication failure
        if: >-
          steps.generate.outputs.generated == 'true' &&
          steps.wait1.outcome == 'failure' &&
          steps.wait2.outcome == 'failure'
        working-directory: private-source
        env:
          JOB_ID: ${{ steps.generate.outputs.job_id }}
          JOB_RESULT: failed
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ATTEMPT: 2
        run: node scripts/autopilot/record-result.mjs

      - name: Persist final private job state
        if: steps.generate.outputs.generated == 'true' && always()
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- automation/state.json; then
            exit 0
          fi
          git config user.name "telic-autopilot[bot]"
          git config user.email "telic-autopilot[bot]@users.noreply.github.com"
          git add automation/state.json
          git commit -m "Record ${{ steps.generate.outputs.job_id }} result" >/dev/null
          git push origin HEAD:main >/dev/null
          echo "Private job state persisted."

      - name: Remove private source checkout
        if: always()
        run: rm -rf private-source

      - name: Fail after exhausted retries
        if: >-
          steps.generate.outputs.generated == 'true' &&
          steps.wait1.outcome == 'failure' &&
          steps.wait2.outcome == 'failure'
        run: exit 1
