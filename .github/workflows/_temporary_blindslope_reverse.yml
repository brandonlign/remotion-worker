name: Temporary BlindSlope S-band inventory

on:
  pull_request:
    types: [synchronize]
    paths:
      - jobs/request.json

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.head_ref, 'render/blindslope')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Query all Gangtok NISAR S-band products
        run: python3 scripts/query-bhoonidhi-gangtok-all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bhoonidhi-gangtok-all-products
          path: bhoonidhi_gangtok_all
          if-no-files-found: error
