name: Temporary BlindSlope download function probe

on:
  pull_request:
    types: [synchronize]
    paths:
      - jobs/request.json

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.head_ref, 'render/blindslope')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Print exact Bhoonidhi download functions
        run: python3 scripts/print-bhoonidhi-download-functions.py
