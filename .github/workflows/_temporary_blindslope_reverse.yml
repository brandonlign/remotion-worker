name: Temporary BlindSlope NISAR config probe

on:
  pull_request:
    types: [synchronize]
    paths:
      - jobs/request.json

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.head_ref, 'render/blindslope')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live Bhoonidhi NISAR archive identifiers
        run: python3 scripts/get-bhoonidhi-nisar-config.py
