name: Temporary BlindSlope S-band validation

on:
  pull_request:
    types: [synchronize]
    paths:
      - jobs/request.json

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.head_ref, 'render/blindslope')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bhoonidhi search with Indian positive controls
        run: python3 scripts/validate-bhoonidhi-query.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bhoonidhi-query-validation
          path: bhoonidhi_validation
          if-no-files-found: error
