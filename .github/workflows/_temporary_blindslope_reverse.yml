name: Temporary BlindSlope download protocol probe

on:
  pull_request:
    types: [synchronize]
    paths:
      - jobs/request.json

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.head_ref, 'render/blindslope')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Bhoonidhi direct-download protocol
        run: python3 scripts/inspect-bhoonidhi-download.py
      - uses: actions/upload-artifact@v4
        with:
          name: bhoonidhi-download-protocol
          path: bhoonidhi_download_contexts.json
