name: Temporary BlindSlope matched download probe

on:
  pull_request:
    types: [synchronize]
    paths:
      - jobs/request.json

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.head_ref, 'render/blindslope')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact matched L/S product downloads
        run: python3 scripts/probe-blindslope-matched-downloads.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blindslope-matched-download-probe
          path: blindslope_download_probe
          if-no-files-found: error
