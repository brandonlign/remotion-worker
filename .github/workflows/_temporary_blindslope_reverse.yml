name: Temporary BlindSlope S-band catalog test

on:
  pull_request:
    types: [synchronize]
    paths:
      - jobs/request.json

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.head_ref, 'render/blindslope')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Search Bhoonidhi guest catalogue for NISAR S-band
        run: python3 scripts/run-bhoonidhi-public-search.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bhoonidhi-public-search
          path: bhoonidhi_public_search
          if-no-files-found: error
