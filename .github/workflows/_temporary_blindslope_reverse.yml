name: Temporary BlindSlope exact S-band query

on:
  pull_request:
    types: [synchronize]
    paths:
      - jobs/request.json

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.head_ref, 'render/blindslope')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Query exact Gangtok NISAR S-band product
        run: python3 scripts/query-bhoonidhi-gangtok.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bhoonidhi-gangtok-query
          path: bhoonidhi_gangtok_query
          if-no-files-found: error
