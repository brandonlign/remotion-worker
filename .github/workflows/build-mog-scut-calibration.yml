name: Build Mog SCUT calibration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out worker branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install converter
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "tensorflow-cpu==2.15.1" \
            "tf2onnx==1.16.1" \
            "onnx==1.15.0" \
            "onnxruntime==1.17.3" \
            "h5py<4"

      - name: Build browser model and empirical distribution
        run: python scripts/run_mog_scut_calibration.py

      - name: Show artifact contents
        run: |
          find build/mog-scut -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          cat build/mog-scut/metadata.json
          cat build/mog-scut/manifest.json

      - name: Upload conversion artifact
        uses: actions/upload-artifact@v4
        with:
          name: mog-scut-calibration
          path: build/mog-scut
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish artifact on temporary worker branch
        if: github.event_name == 'pull_request'
        run: |
          rm -rf artifacts/mog-scut
          mkdir -p artifacts
          cp -R build/mog-scut artifacts/mog-scut
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/mog-scut
          git diff --cached --quiet && exit 0
          git commit -m "Add generated Mog SCUT calibration artifact"
          git push origin HEAD:${{ github.head_ref }}
