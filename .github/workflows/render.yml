name: Cleanup private Duolingo render folder

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: read

concurrency:
  group: remotion-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'render/r260729-duo-realui-q4n7'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Remove exact audited Duolingo render folder
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -Eeuo pipefail
          target='r260729-duo-realui-q4n7'
          config="$(mktemp)"
          trap 'rm -f "$config"' EXIT
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$config"
          chmod 600 "$config"

          before="$(rclone lsf gdrive:Telic-Renders --dirs-only --config "$config" --stats 0 --log-level ERROR)"
          if grep -Fxq "$target/" <<<"$before"; then
            rclone purge "gdrive:Telic-Renders/$target" \
              --config "$config" \
              --stats 0 \
              --log-level ERROR
          fi

          after="$(rclone lsf gdrive:Telic-Renders --dirs-only --config "$config" --stats 0 --log-level ERROR)"
          if grep -Fxq "$target/" <<<"$after"; then
            echo 'Temporary Duolingo render folder still exists.' >&2
            exit 1
          fi

          echo 'Exact Duolingo render-folder cleanup completed.'
