name: Render private Remotion source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: read

concurrency:
  group: remotion-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'render/')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate render request
        id: request
        run: node scripts/validate-job.mjs jobs/request.json

      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rclone

      - name: Render and build private review package
        id: render
        shell: bash
        env:
          JOB_ID: ${{ steps.request.outputs.job_id }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          ELEVENLABS_API_KEYS_JSON: ${{ secrets.ELEVENLABS_API_KEYS_JSON }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/render-result"
          bash scripts/run-render.sh \
            jobs/request.json \
            private-source \
            "$RUNNER_TEMP/render-result" \
            >"$RUNNER_TEMP/private-build.log" 2>&1
          code=$?
          cp "$RUNNER_TEMP/private-build.log" "$RUNNER_TEMP/render-result/private-build.log"
          printf '%s\n' "$code" > "$RUNNER_TEMP/render-result/exit-code.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "Private render completed; uploading results."
          else
            echo "Private render failed; uploading the private diagnostic package."
          fi
          exit 0

      - name: Remove private source checkout
        if: always()
        run: rm -rf private-source

      - name: Probe public Bhoonidhi portal
        if: always() && startsWith(github.head_ref, 'render/blindslope')
        run: python3 scripts/probe-bhoonidhi-portal.py "$RUNNER_TEMP/render-result" > "$RUNNER_TEMP/render-result/portal-probe.log"

      - name: Print BlindSlope measured summary
        if: always() && startsWith(github.head_ref, 'render/blindslope')
        run: |
          echo '--- BLINDSLOPE SUMMARY BEGIN ---'
          cat "$RUNNER_TEMP/render-result/summary.json"
          echo '--- BLINDSLOPE SUMMARY END ---'
          echo '--- BLINDSLOPE GRANULE INVENTORY BEGIN ---'
          python3 - "$RUNNER_TEMP/render-result/l_band_granules.csv" <<'PY'
          import csv, json, sys
          rows=list(csv.DictReader(open(sys.argv[1], newline='')))
          keep={'NISAR_L2_GUNW_PROVISIONAL_V1','NISAR_L1_RIFG_PROVISIONAL_V1','NISAR_L2_GSLC_PROVISIONAL_V1'}
          for r in rows:
              if r['collection'] not in keep:
                  continue
              print(json.dumps({k:r.get(k) for k in ['collection','granule_id','start_time','end_time','bbox','direction','cycle_candidate','track_candidate','frame_candidate','timestamps_in_name']}, separators=(',',':')))
          PY
          echo '--- BLINDSLOPE GRANULE INVENTORY END ---'
          echo '--- BHOONIDHI PORTAL PROBE BEGIN ---'
          python3 - "$RUNNER_TEMP/render-result/portal_probe.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1]))
          print(json.dumps({
            'package':p.get('package'),
            'url_probes':p.get('url_probes'),
            'portal_asset_probes':p.get('portal_asset_probes'),
            'source_hints':[x for x in p.get('source_hints',[]) if any(k in x.get('text','').lower() for k in ['http','base_url','search_url','archive_url','session.post','session.get','requests.post','requests.get'])]
          }, indent=2, sort_keys=True))
          PY
          echo '--- BHOONIDHI PORTAL PROBE END ---'

      - name: Upload BlindSlope evidence artifact
        if: always() && startsWith(github.head_ref, 'render/blindslope')
        uses: actions/upload-artifact@v4
        with:
          name: blindslope-pilot-results
          path: ${{ runner.temp }}/render-result
          if-no-files-found: error

      - name: Upload privately to Google Drive
        if: always() && !startsWith(github.head_ref, 'render/blindslope')
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          JOB_ID: ${{ steps.request.outputs.job_id }}
        run: |
          if bash scripts/upload-drive.sh \
            "$RUNNER_TEMP/render-result" \
            "$JOB_ID" \
            >"$RUNNER_TEMP/private-upload.log" 2>&1; then
            echo "Private Drive upload completed."
          else
            echo "Private Drive upload failed. Check the configured Drive secret."
            exit 1
          fi

      - name: Fail workflow when rendering failed
        if: always() && steps.render.outputs.exit_code != '0'
        run: |
          echo "The private render failed. Detailed diagnostics were uploaded to Drive."
          exit 1
