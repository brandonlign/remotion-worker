name: Promote verified Duolingo render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: read

concurrency:
  group: remotion-promote-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promote:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'render/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Promote verified single-player MP4
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -Eeuo pipefail
          JOB_ID="$(node -p "require('./jobs/request.json').jobId")"
          if [ "$JOB_ID" != "r260729-duo-balanced-a1m6-promote" ]; then
            echo "Unexpected promotion target." >&2
            exit 65
          fi
          if [ -z "${RCLONE_CONFIG_B64:-}" ]; then
            echo "Drive credentials are unavailable." >&2
            exit 65
          fi

          CONFIG="$(mktemp)"
          trap 'rm -f "$CONFIG"' EXIT
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$CONFIG"
          chmod 600 "$CONFIG"

          SOURCE="gdrive:Telic-Renders/r260729-duo-balanced-a1m6/telic-duolingo-streak-freeze.mp4"
          DEST_FOLDER="gdrive:Telic-Renders/FINAL - Duolingo Streak Freeze"
          DEST="$DEST_FOLDER/FINAL_Duolingo_Streak_Freeze.mp4"

          rclone copyto "$SOURCE" "$DEST" --config "$CONFIG" --stats 0 --log-level ERROR

          listing="$(rclone lsf "$DEST_FOLDER" --config "$CONFIG" --files-only --log-level ERROR)"
          if [ "$(printf '%s\n' "$listing" | sed '/^$/d' | wc -l | tr -d ' ')" != "1" ]; then
            echo "Final folder must contain exactly one file." >&2
            exit 1
          fi
          if ! printf '%s\n' "$listing" | grep -Fxq 'FINAL_Duolingo_Streak_Freeze.mp4'; then
            echo "Final MP4 is missing after promotion." >&2
            exit 1
          fi

          rclone purge "gdrive:Telic-Renders/r260729-duo-balanced-a1m6" --config "$CONFIG" --log-level ERROR
          echo "Verified MP4 promoted to a single-file final folder; temporary job folder removed."
