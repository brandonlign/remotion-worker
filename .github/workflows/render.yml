name: Validate Telic controller context callback

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: read

concurrency:
  group: telic-controller-context-callback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-controller:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'render/telic-controller-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out worker trigger
        uses: actions/checkout@v4

      - name: Check out private controller branch
        uses: actions/checkout@v4
        with:
          repository: brandonlign/remotion-video
          ref: agent/telic-controller-v3
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Reconstruct package and validate browser-context callback
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail

          work="$RUNNER_TEMP/telic-controller-validation"
          rm -rf "$work"
          mkdir -p "$work/extracted"

          archive_b64="$work/controller.b64"
          archive="$work/controller.tar.gz"
          : > "$archive_b64"
          for chunk in 00 01 02 03; do
            cat "tools/telic-controller-v3/archive/chunk-$chunk.b64" >> "$archive_b64"
          done
          base64 -d "$archive_b64" > "$archive"

          expected="$(sed -n 's/^EXPECTED_SHA256="\([0-9a-f]\{64\}\)"$/\1/p' tools/telic-controller-v3/install-from-repo.sh | head -n1)"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual" = "$expected"
          tar -xzf "$archive" -C "$work/extracted"

          controller="$work/extracted/telic-vm-controller-v3"
          for override in src/oauth-callback.mjs src/authorize-google.mjs; do
            mkdir -p "$controller/$(dirname "$override")"
            cp "tools/telic-controller-v3/overrides/$override" "$controller/$override"
          done

          bash -n tools/telic-controller-v3/install-from-repo.sh
          node --check "$controller/src/oauth-callback.mjs"
          node --check "$controller/src/authorize-google.mjs"
          grep -q 'context.route(routePattern, routeHandler)' "$controller/src/authorize-google.mjs"
          grep -q 'context.on("request"' "$controller/src/authorize-google.mjs"
          grep -q 'context.on("requestfailed"' "$controller/src/authorize-google.mjs"
          grep -q 'VM browser context' "$controller/src/authorize-google.mjs"
          grep -q 'https://www.googleapis.com/auth/drive.readonly' "$controller/src/authorize-google.mjs"
          if grep -q 'auth/youtube' "$controller/src/authorize-google.mjs"; then
            echo "YouTube OAuth scope returned unexpectedly." >&2
            exit 1
          fi

          cd "$controller"
          npm install --no-audit --no-fund
          npm test

          CONTROLLER="$controller" node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {execFileSync} from "node:child_process";
          import {pathToFileURL} from "node:url";
          import {chromium} from "playwright-core";

          const moduleUrl = pathToFileURL(`${process.env.CONTROLLER}/src/oauth-callback.mjs`);
          const {parseOAuthCallbackUrl} = await import(moduleUrl);
          const redirectUri = "http://127.0.0.1:8787/oauth2callback";
          const state = "state-123";
          const callbackUrl = `${redirectUri}?state=${state}&code=one-time-code`;
          assert.deepEqual(parseOAuthCallbackUrl(callbackUrl, {redirectUri, state}), {code: "one-time-code"});

          const executablePath = execFileSync("bash", ["-lc", "command -v google-chrome || command -v chromium || command -v chromium-browser"], {encoding: "utf8"}).trim();
          assert.ok(executablePath, "Chrome executable was not found on the worker.");

          const browser = await chromium.launch({headless: true, executablePath});
          const context = await browser.newContext();
          let intercepted = null;
          await context.route(`${redirectUri}*`, async (route) => {
            intercepted = route.request().url();
            await route.fulfill({
              status: 200,
              contentType: "text/html; charset=utf-8",
              body: "<h2>Telic authorization complete</h2>",
            });
          });

          // Use a second tab to reproduce the VM failure mode that the old
          // page-local listeners missed.
          const unrelatedPage = await context.newPage();
          await unrelatedPage.setContent("<p>original authorization tab</p>");
          const callbackPage = await context.newPage();
          await callbackPage.goto(callbackUrl, {waitUntil: "domcontentloaded"});
          assert.equal(intercepted, callbackUrl);
          assert.match(await callbackPage.textContent("body"), /Telic authorization complete/);
          await browser.close();
          console.log("Cross-tab browser-context OAuth callback interception passed.");
          NODE

          echo "Validated context-callback controller at private commit $(git rev-parse HEAD)."
