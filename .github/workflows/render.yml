name: Cleanup duplicate Duolingo Drive item

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: read

concurrency:
  group: remotion-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'render/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Remove exact duplicate and preserve final MP4
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -Eeuo pipefail
          JOB_ID="$(node -p "require('./jobs/request.json').jobId")"
          if [ "$JOB_ID" != "r260729-duo-clarity-g8p4" ]; then
            echo "Unexpected cleanup target." >&2
            exit 65
          fi
          if [ -z "${RCLONE_CONFIG_B64:-}" ]; then
            echo "Drive credentials are unavailable." >&2
            exit 65
          fi
          CONFIG="$(mktemp)"
          trap 'rm -f "$CONFIG"' EXIT
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$CONFIG"
          chmod 600 "$CONFIG"
          FOLDER="gdrive:Telic-Renders/FINAL - Duolingo Streak Freeze"
          DUPLICATE="$FOLDER/FINAL_Duolingo_Streak_Freeze"
          rclone deletefile "$DUPLICATE" --config "$CONFIG" --log-level ERROR || true
          listing="$(rclone lsf "$FOLDER" --config "$CONFIG" --files-only --log-level ERROR)"
          if printf '%s\n' "$listing" | grep -Fxq 'FINAL_Duolingo_Streak_Freeze'; then
            echo "Duplicate Drive item still exists." >&2
            exit 1
          fi
          if ! printf '%s\n' "$listing" | grep -Fxq 'FINAL_Duolingo_Streak_Freeze.mp4'; then
            echo "Final MP4 is missing after cleanup." >&2
            exit 1
          fi
          echo "Duplicate removed and final MP4 preserved."
