name: One-time Telic Drive cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: read

concurrency:
  group: telic-drive-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'render/drive-cleanup-')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Consolidate private Drive folders
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          sed -i 's/section.get("scope", "").strip() != "drive.file"/"drive.file" not in section.get("scope", "").strip()/' scripts/drive-cleanup-once.py
          python3 scripts/drive-cleanup-once.py
