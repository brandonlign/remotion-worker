name: Validate Telic controller browser callback

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: read

concurrency:
  group: telic-controller-callback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-controller:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'render/telic-controller-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out worker trigger
        uses: actions/checkout@v4

      - name: Check out private controller branch
        uses: actions/checkout@v4
        with:
          repository: brandonlign/remotion-video
          ref: agent/telic-controller-v3
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Reconstruct package and apply installer overrides
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail

          work="$RUNNER_TEMP/telic-controller-validation"
          rm -rf "$work"
          mkdir -p "$work/extracted"

          archive_b64="$work/controller.b64"
          archive="$work/controller.tar.gz"
          : > "$archive_b64"
          for chunk in 00 01 02 03; do
            cat "tools/telic-controller-v3/archive/chunk-$chunk.b64" >> "$archive_b64"
          done
          base64 -d "$archive_b64" > "$archive"

          expected="$(sed -n 's/^EXPECTED_SHA256="\([0-9a-f]\{64\}\)"$/\1/p' tools/telic-controller-v3/install-from-repo.sh | head -n1)"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test "$expected" = "449d849d38ae658b3c3eda85540c4324d2464bb1df97dc4042824c32f59758d4"
          test "$actual" = "$expected"
          tar -xzf "$archive" -C "$work/extracted"

          controller="$work/extracted/telic-vm-controller-v3"
          for override in src/oauth-callback.mjs src/authorize-google.mjs; do
            mkdir -p "$controller/$(dirname "$override")"
            cp "tools/telic-controller-v3/overrides/$override" "$controller/$override"
          done

          bash -n tools/telic-controller-v3/install-from-repo.sh
          node --check "$controller/src/oauth-callback.mjs"
          node --check "$controller/src/authorize-google.mjs"
          grep -q 'page.on("request"' "$controller/src/authorize-google.mjs"
          grep -q 'page.on("requestfailed"' "$controller/src/authorize-google.mjs"
          grep -q 'https://www.googleapis.com/auth/drive.readonly' "$controller/src/authorize-google.mjs"
          if grep -q 'auth/youtube' "$controller/src/authorize-google.mjs"; then
            echo "YouTube OAuth scope returned unexpectedly." >&2
            exit 1
          fi

          CONTROLLER="$controller" node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {pathToFileURL} from "node:url";
          const moduleUrl = pathToFileURL(`${process.env.CONTROLLER}/src/oauth-callback.mjs`);
          const {parseOAuthCallbackUrl} = await import(moduleUrl);
          const options = {
            redirectUri: "http://127.0.0.1:8787/oauth2callback",
            state: "state-123",
          };
          assert.deepEqual(
            parseOAuthCallbackUrl(
              "http://127.0.0.1:8787/oauth2callback?state=state-123&code=one-time-code",
              options,
            ),
            {code: "one-time-code"},
          );
          assert.match(
            parseOAuthCallbackUrl(
              "http://127.0.0.1:8787/oauth2callback?state=wrong&code=one-time-code",
              options,
            ).error.message,
            /state did not match/,
          );
          console.log("VM-browser OAuth callback parser passed.");
          NODE

          cd "$controller"
          npm install --no-audit --no-fund
          npm test

          echo "Validated callback-fixed controller at private commit $(git -C "$GITHUB_WORKSPACE/private-source" rev-parse HEAD)."
