name: Render private Remotion source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: remotion-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'render/')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate render request
        id: request
        run: node scripts/validate-job.mjs jobs/request.json

      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rclone

      - name: Render and build private review package
        id: render
        shell: bash
        env:
          JOB_ID: ${{ steps.request.outputs.job_id }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          ELEVENLABS_API_KEYS_JSON: ${{ secrets.ELEVENLABS_API_KEYS_JSON }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/render-result"
          bash scripts/run-render.sh \
            jobs/request.json \
            private-source \
            "$RUNNER_TEMP/render-result" \
            >"$RUNNER_TEMP/private-build.log" 2>&1
          code=$?
          cp "$RUNNER_TEMP/private-build.log" "$RUNNER_TEMP/render-result/private-build.log"
          printf '%s\n' "$code" > "$RUNNER_TEMP/render-result/exit-code.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "Private render completed; evaluating publication configuration."
          else
            echo "Private render failed; preserving the private diagnostic package."
          fi
          exit 0

      - name: Upload and schedule on YouTube
        id: publish
        if: always() && steps.render.outputs.exit_code == '0'
        shell: bash
        env:
          AUTOPUBLISH_ENABLED: ${{ vars.AUTOPUBLISH_ENABLED }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set +e
          if [ "${AUTOPUBLISH_ENABLED:-0}" != "1" ]; then
            node - "$RUNNER_TEMP/render-result/youtube-status.json" "${{ steps.request.outputs.job_id }}" <<'NODE'
          const fs = require("node:fs");
          const [outputPath, jobId] = process.argv.slice(2);
          fs.writeFileSync(outputPath, `${JSON.stringify({
            status: "disabled",
            jobId,
            completedAt: new Date().toISOString(),
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
            printf '%s\n' "YouTube publication is disabled; the private render remains a Drive candidate." \
              > "$RUNNER_TEMP/private-youtube.log"
            cp "$RUNNER_TEMP/private-youtube.log" "$RUNNER_TEMP/render-result/private-youtube.log"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            echo "YouTube publication is disabled; continuing with private Drive delivery."
            exit 0
          fi

          output_name="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(value.outputName);' "$RUNNER_TEMP/render-result/status.json")"
          node scripts/upload-youtube.mjs \
            "$RUNNER_TEMP/render-result/${output_name}.mp4" \
            private-source/automation/current/youtube.json \
            "$RUNNER_TEMP/render-result/youtube-status.json" \
            >"$RUNNER_TEMP/private-youtube.log" 2>&1
          code=$?
          cp "$RUNNER_TEMP/private-youtube.log" "$RUNNER_TEMP/render-result/private-youtube.log"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "YouTube accepted, processed, and scheduled the private render."
          else
            echo "YouTube publication failed; preserving private diagnostics."
          fi
          exit 0

      - name: Remove private source checkout
        if: always()
        run: rm -rf private-source

      - name: Refresh private checksums
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/render-result" ]; then
            find "$RUNNER_TEMP/render-result" -type f ! -name checksums.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > "$RUNNER_TEMP/render-result/checksums.txt"
          fi

      - name: Upload privately to Google Drive
        id: drive
        if: always()
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          JOB_ID: ${{ steps.request.outputs.job_id }}
        run: |
          if bash scripts/upload-drive.sh \
            "$RUNNER_TEMP/render-result" \
            "$JOB_ID" \
            >"$RUNNER_TEMP/private-upload.log" 2>&1; then
            echo "Private Drive upload completed."
          else
            echo "Private Drive upload failed. Check the configured Drive secret."
            exit 1
          fi

      - name: Close successful temporary render request
        if: >-
          always() &&
          steps.render.outputs.exit_code == '0' &&
          steps.publish.outputs.exit_code == '0' &&
          steps.drive.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr close "${{ github.event.pull_request.number }}" --delete-branch

      - name: Fail workflow when rendering or enabled publication failed
        if: >-
          always() &&
          (steps.render.outputs.exit_code != '0' || steps.publish.outputs.exit_code != '0')
        run: |
          echo "The private render or enabled YouTube publication failed. Detailed diagnostics were uploaded to Drive."
          exit 1
