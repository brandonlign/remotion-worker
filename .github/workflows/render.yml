name: Remove worker-owned Telic render root

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json
      - .github/workflows/render.yml

permissions:
  contents: read

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'render/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Validate cleanup request
        run: node scripts/validate-job.mjs jobs/request.json

      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Remove Telic-Renders root
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -Eeuo pipefail
          config_file="$(mktemp)"
          trap 'rm -f "$config_file"' EXIT
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$config_file"
          chmod 600 "$config_file"
          rclone purge "gdrive:Telic-Renders" \
            --config "$config_file" \
            --drive-use-trash=false \
            --stats 0 \
            --log-level ERROR
          if rclone lsf "gdrive:Telic-Renders" --config "$config_file" >/dev/null 2>&1; then
            echo "Telic-Renders still exists after purge." >&2
            exit 1
          fi
          echo "Worker-owned Telic-Renders root removed."
