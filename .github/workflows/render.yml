name: Recover Telic controller package

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: read

concurrency:
  group: telic-controller-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recover-controller:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'render/telic-controller-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out worker marker
        uses: actions/checkout@v4

      - name: Check out private controller history
        uses: actions/checkout@v4
        with:
          repository: brandonlign/remotion-video
          ref: agent/telic-controller-v3
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 0

      - name: Recover newest coherent controller archive
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail

          work="$RUNNER_TEMP/telic-controller-recovery"
          artifact="$RUNNER_TEMP/telic-controller-artifact"
          rm -rf "$work" "$artifact"
          mkdir -p "$work" "$artifact/source"

          while IFS= read -r commit; do
            [[ -n "$commit" ]] || continue
            complete=1
            for path in \
              tools/telic-controller-v3/install-from-repo.sh \
              tools/telic-controller-v3/archive/chunk-00.b64 \
              tools/telic-controller-v3/archive/chunk-01.b64 \
              tools/telic-controller-v3/archive/chunk-02.b64 \
              tools/telic-controller-v3/archive/chunk-03.b64; do
              if ! git cat-file -e "$commit:$path" 2>/dev/null; then
                complete=0
                break
              fi
            done
            [[ "$complete" == 1 ]] || continue

            candidate_b64="$work/$commit.b64"
            candidate_archive="$work/$commit.tar.gz"
            : > "$candidate_b64"
            for chunk in 00 01 02 03; do
              git show "$commit:tools/telic-controller-v3/archive/chunk-$chunk.b64" >> "$candidate_b64"
            done
            base64 -d "$candidate_b64" > "$candidate_archive" 2>/dev/null || continue

            expected="$(git show "$commit:tools/telic-controller-v3/install-from-repo.sh" \
              | sed -n 's/^EXPECTED_SHA256="\([0-9a-f]\{64\}\)"$/\1/p' \
              | head -n1)"
            actual="$(sha256sum "$candidate_archive" | awk '{print $1}')"
            [[ -n "$expected" && "$expected" == "$actual" ]] || continue
            tar -tzf "$candidate_archive" >/dev/null 2>&1 || continue

            cp "$candidate_archive" "$artifact/controller.tar.gz"
            tar -xzf "$candidate_archive" -C "$artifact/source"
            cat > "$artifact/recovery.json" <<EOF
          {
            "commit": "$commit",
            "sha256": "$actual"
          }
          EOF
            echo "TELIC_RECOVERY_COMMIT=$commit"
            echo "TELIC_RECOVERY_SHA256=$actual"
            exit 0
          done < <(git rev-list --all -- tools/telic-controller-v3)

          echo "No coherent historical controller package was found." >&2
          git log --oneline --all -- tools/telic-controller-v3 >&2
          exit 1

      - name: Upload recovered controller privately
        uses: actions/upload-artifact@v4
        with:
          name: telic-controller-recovered-source
          path: ${{ runner.temp }}/telic-controller-artifact
          if-no-files-found: error
          retention-days: 1
