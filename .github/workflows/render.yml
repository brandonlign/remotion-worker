name: Recover Telic controller package

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: read

concurrency:
  group: telic-controller-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recover-controller:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'render/telic-controller-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out worker marker
        uses: actions/checkout@v4

      - name: Check out private controller history
        uses: actions/checkout@v4
        with:
          repository: brandonlign/remotion-video
          ref: agent/telic-controller-v3
          token: ${{ secrets.SOURCE_REPO_WRITE_TOKEN || secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: true
          fetch-depth: 0

      - name: Recover newest coherent controller archive
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune

          work="$RUNNER_TEMP/telic-controller-recovery"
          rm -rf "$work"
          mkdir -p "$work/extracted"

          found_commit=""
          found_sha=""
          found_archive=""

          while IFS= read -r commit; do
            [[ -n "$commit" ]] || continue
            complete=1
            for path in \
              tools/telic-controller-v3/install-from-repo.sh \
              tools/telic-controller-v3/archive/chunk-00.b64 \
              tools/telic-controller-v3/archive/chunk-01.b64 \
              tools/telic-controller-v3/archive/chunk-02.b64 \
              tools/telic-controller-v3/archive/chunk-03.b64; do
              if ! git cat-file -e "$commit:$path" 2>/dev/null; then
                complete=0
                break
              fi
            done
            [[ "$complete" == 1 ]] || continue

            candidate_b64="$work/$commit.b64"
            candidate_archive="$work/$commit.tar.gz"
            : > "$candidate_b64"
            for chunk in 00 01 02 03; do
              git show "$commit:tools/telic-controller-v3/archive/chunk-$chunk.b64" >> "$candidate_b64"
            done
            if ! base64 -d "$candidate_b64" > "$candidate_archive" 2>/dev/null; then
              continue
            fi

            expected="$(git show "$commit:tools/telic-controller-v3/install-from-repo.sh" \
              | sed -n 's/^EXPECTED_SHA256="\([0-9a-f]\{64\}\)"$/\1/p' \
              | head -n1)"
            actual="$(sha256sum "$candidate_archive" | awk '{print $1}')"
            if [[ -z "$expected" || "$expected" != "$actual" ]]; then
              continue
            fi
            if ! tar -tzf "$candidate_archive" >/dev/null 2>&1; then
              continue
            fi

            found_commit="$commit"
            found_sha="$actual"
            found_archive="$candidate_archive"
            break
          done < <(git rev-list --all -- tools/telic-controller-v3)

          if [[ -z "$found_commit" ]]; then
            echo "No coherent historical controller package was found." >&2
            git log --oneline --all -- tools/telic-controller-v3 >&2
            exit 1
          fi

          tar -xzf "$found_archive" -C "$work/extracted"
          source_root="$(find "$work/extracted" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          [[ -n "$source_root" && -d "$source_root" ]]

          git checkout -B agent/telic-controller-v3-source-recovery "$found_commit"
          recovery_dir="tools/telic-controller-v3/source-recovery"
          rm -rf "$recovery_dir"
          mkdir -p "$recovery_dir"
          cp -a "$source_root"/. "$recovery_dir"/
          cat > "$recovery_dir/RECOVERY.md" <<EOF
          # Controller source recovery

          Recovered from commit: $found_commit

          Verified archive SHA-256: $found_sha
          EOF

          git config user.name "telic-controller-recovery[bot]"
          git config user.email "telic-controller-recovery[bot]@users.noreply.github.com"
          git add "$recovery_dir"
          git commit -m "Recover coherent Telic controller source"
          git push --force origin HEAD:agent/telic-controller-v3-source-recovery

          echo "Recovered controller source from $found_commit ($found_sha)."
