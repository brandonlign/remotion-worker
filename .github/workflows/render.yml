name: Diagnose Telic Drive handoff

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json
      - .github/workflows/render.yml

permissions:
  contents: read

concurrency:
  group: telic-drive-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'render/drive-handoff-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out diagnostic harness
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Diagnose restricted Drive upload
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/drive-diagnostic"
          mkdir -p "$result"
          printf '%s\n' '{"status":"diagnostic"}' > "$result/status.json"

          set +e
          bash scripts/upload-drive.sh "$result" "telic-drive-diagnostic-20260805" \
            >"$RUNNER_TEMP/drive-diagnostic.log" 2>&1
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "Drive upload contract passed."
            exit 0
          fi

          message="$(tail -n 12 "$RUNNER_TEMP/drive-diagnostic.log" \
            | sed -E 's/(token|client_secret|refresh_token|access_token)[[:space:]]*=[[:space:]]*[^[:space:]]+/\1=[REDACTED]/Ig')"
          echo "Drive upload contract failed with code $code."
          printf '%s\n' "$message"
          exit "$code"
