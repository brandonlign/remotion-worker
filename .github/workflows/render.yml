name: Render private Remotion source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: read

concurrency:
  group: remotion-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'render/')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate render request
        id: request
        run: node scripts/validate-job.mjs jobs/request.json

      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rclone

      - name: Render and build private review package
        id: render
        shell: bash
        env:
          JOB_ID: ${{ steps.request.outputs.job_id }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          ELEVENLABS_API_KEYS_JSON: ${{ secrets.ELEVENLABS_API_KEYS_JSON }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/render-result"
          bash scripts/run-render.sh \
            jobs/request.json \
            private-source \
            "$RUNNER_TEMP/render-result" \
            >"$RUNNER_TEMP/private-build.log" 2>&1
          code=$?
          cp "$RUNNER_TEMP/private-build.log" "$RUNNER_TEMP/render-result/private-build.log"
          printf '%s\n' "$code" > "$RUNNER_TEMP/render-result/exit-code.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "Private render completed; preparing encrypted handoff."
          else
            node scripts/summarize-private-check.mjs \
              "$RUNNER_TEMP/private-build.log" \
              "$RUNNER_TEMP/render-result/render-phase.txt"
          fi
          exit 0

      - name: Remove private source checkout
        if: always()
        run: rm -rf private-source

      - name: Encrypt private diagnostic handoff
        if: always()
        shell: bash
        run: |
          tar -C "$RUNNER_TEMP/render-result" -czf "$RUNNER_TEMP/qr-keydiag-package.tar.gz" .
          openssl cms -encrypt \
            -binary \
            -aes256 \
            -in "$RUNNER_TEMP/qr-keydiag-package.tar.gz" \
            -outform DER \
            -out "$RUNNER_TEMP/qr-keydiag-package.cms" \
            handoff/qr-review-cert.pem
          rm -f "$RUNNER_TEMP/qr-keydiag-package.tar.gz"

      - name: Store ciphertext-only private diagnostic handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr-encrypted-keydiag-handoff
          path: ${{ runner.temp }}/qr-keydiag-package.cms
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload privately to Google Drive
        if: always()
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          JOB_ID: ${{ steps.request.outputs.job_id }}
        run: |
          if bash scripts/upload-drive.sh \
            "$RUNNER_TEMP/render-result" \
            "$JOB_ID" \
            >"$RUNNER_TEMP/private-upload.log" 2>&1; then
            echo "Private Drive upload completed."
          else
            reason="unclassified"
            if grep -q "Drive upload secret is not configured" "$RUNNER_TEMP/private-upload.log"; then
              reason="missing-secret"
            elif grep -q "base64" "$RUNNER_TEMP/private-upload.log"; then
              reason="config-decode"
            elif grep -q "remote named gdrive" "$RUNNER_TEMP/private-upload.log"; then
              reason="remote-missing"
            elif grep -Eq "least-privilege drive.file scope|configured Drive scope cannot perform" "$RUNNER_TEMP/private-upload.log"; then
              reason="scope-invalid"
            elif grep -q "Telic Production" "$RUNNER_TEMP/private-upload.log"; then
              reason="production-folder-resolution"
            elif grep -q "TEMP RENDERS & REVIEWS" "$RUNNER_TEMP/private-upload.log"; then
              reason="temp-folder-resolution"
            elif grep -Eqi "invalid_grant|token.*expired|oauth|unauthorized|authentication" "$RUNNER_TEMP/private-upload.log"; then
              reason="oauth-credential"
            elif grep -Eqi "rate.?limit|too many requests|429" "$RUNNER_TEMP/private-upload.log"; then
              reason="rate-limit"
            elif grep -Eqi "permission|forbidden|403" "$RUNNER_TEMP/private-upload.log"; then
              reason="permission"
            fi
            echo "Private Drive upload failed: ${reason}."
            exit 1
          fi

      - name: Fail workflow when rendering failed
        if: always() && steps.render.outputs.exit_code != '0'
        run: |
          echo "The private render failed. Detailed diagnostics remain private."
          exit 1
