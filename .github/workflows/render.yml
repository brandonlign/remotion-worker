name: Validate Telic controller Studio publishing

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: read

concurrency:
  group: telic-controller-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-controller:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'render/telic-controller-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out worker trigger
        uses: actions/checkout@v4

      - name: Check out private controller branch
        uses: actions/checkout@v4
        with:
          repository: brandonlign/remotion-video
          ref: agent/telic-controller-v3
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify, install, and test packaged controller
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail

          work="$RUNNER_TEMP/telic-controller-validation"
          rm -rf "$work"
          mkdir -p "$work/extracted"

          archive_b64="$work/controller.b64"
          archive="$work/controller.tar.gz"
          : > "$archive_b64"
          for chunk in 00 01 02 03; do
            cat "tools/telic-controller-v3/archive/chunk-$chunk.b64" >> "$archive_b64"
          done
          base64 -d "$archive_b64" > "$archive"

          expected="$(sed -n 's/^EXPECTED_SHA256="\([0-9a-f]\{64\}\)"$/\1/p' tools/telic-controller-v3/install-from-repo.sh | head -n1)"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test "$expected" = "449d849d38ae658b3c3eda85540c4324d2464bb1df97dc4042824c32f59758d4"
          test "$actual" = "$expected"
          tar -tzf "$archive" >/dev/null
          tar -xzf "$archive" -C "$work/extracted"

          controller="$work/extracted/telic-vm-controller-v3"
          test -d "$controller"
          test "$(find "$controller" -type f | wc -l | tr -d ' ')" = "22"

          bash -n tools/telic-controller-v3/install-from-repo.sh
          bash -n "$controller/install.sh"
          node --check "$controller"/src/*.mjs

          grep -Rqs 'https://www.googleapis.com/auth/drive.readonly' "$controller/src"
          grep -Rqs 'studio.youtube.com' "$controller/src"
          grep -Rqs 'expectedChannelTitle' "$controller"
          if grep -RniE 'youtube/v3|auth/youtube|youtube\.upload|getAuthorizedChannel|updateVideoMetadata' "$controller/src"; then
            echo "Obsolete YouTube API/OAuth code remains in the packaged controller." >&2
            exit 1
          fi

          cd "$controller"
          npm install --no-audit --no-fund
          npm test

          echo "Validated controller archive SHA-256: $actual"
          echo "Studio-only publisher package passed clean install and tests."
