name: Cleanup private render folders

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: read

concurrency:
  group: drive-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'render/')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Remove audited render folders
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -Eeuo pipefail
          if [ -z "${RCLONE_CONFIG_B64:-}" ]; then
            echo "Drive credentials are unavailable." >&2
            exit 65
          fi

          config="$(mktemp)"
          trap 'rm -f "$config"' EXIT
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$config"
          chmod 600 "$config"

          folders=(
            r260729-v2-k8m4q1
            r260729-d7f3c9a1-r3
            r260729-d7k4m2
            r260729-d7f3c9a1-r2
            r260729-d7f3c9a1
          )

          for folder in "${folders[@]}"; do
            case "$folder" in
              r260729-*) ;;
              *) echo "Refusing unexpected folder name." >&2; exit 65 ;;
            esac
            rclone purge "gdrive:Telic-Renders/$folder" \
              --config "$config" \
              --stats 0 \
              --log-level ERROR
          done

          remaining="$(rclone lsf gdrive:Telic-Renders --dirs-only --config "$config" --stats 0 --log-level ERROR)"
          for folder in "${folders[@]}"; do
            if grep -Fxq "$folder/" <<<"$remaining"; then
              echo "Folder still exists after cleanup: $folder" >&2
              exit 1
            fi
          done

          echo "Audited render-folder cleanup completed."
