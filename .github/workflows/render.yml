name: Render private Remotion source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: remotion-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'render/')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate render request
        id: request
        run: node scripts/validate-job.mjs jobs/request.json

      - name: Cache forced-alignment runtime
        if: steps.request.outputs.mode == 'voice-prep'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/telic-whisperx-3.8.6
            ~/.cache/torch
            ~/.cache/huggingface
          key: telic-whisperx-3.8.6-en-${{ runner.os }}-${{ runner.arch }}-py3

      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Cache npm package downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: telic-remotion-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('private-source/package-lock.json') }}
          restore-keys: |
            telic-remotion-npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache public rclone binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/telic-tools/rclone-v1.75.0
          key: telic-rclone-v1.75.0-${{ runner.os }}-${{ runner.arch }}

      - name: Cache public full FFmpeg preview tools
        if: steps.request.outputs.mode == 'render-sequence'
        uses: actions/cache@v4
        with:
          path: ~/.cache/telic-tools/ffmpeg-n8.1-btbn-20260813
          key: telic-ffmpeg-n8.1-btbn-20260813-${{ runner.os }}-${{ runner.arch }}

      - name: Ensure required system tools
        shell: bash
        env:
          RENDER_MODE: ${{ steps.request.outputs.mode }}
        run: |
          set -Eeuo pipefail

          # rclone is public transport tooling, so keep a version-pinned,
          # checksum-verified public binary cache. The bootstrap has an apt
          # fallback and never caches credentials, locators, or Telic content.
          source scripts/ensure-public-rclone.sh

          packages=()

          # Window previews need a full FFmpeg build for review stills. Use the
          # pinned/checksummed public bundle instead of Remotion's intentionally
          # minimal bundled FFmpeg. Voice-prep and final render retain the
          # distro FFmpeg compatibility path.
          if [[ "$RENDER_MODE" == "render-sequence" ]]; then
            source scripts/ensure-public-ffmpeg.sh
          elif ! command -v ffmpeg >/dev/null 2>&1; then
            packages+=(ffmpeg)
          fi
          if [[ "$RENDER_MODE" == "voice-prep" ]] && ! python3 -c 'import venv' >/dev/null 2>&1; then
            packages+=(python3-venv)
          fi

          if (( ${#packages[@]} == 0 )); then
            echo "No additional system packages are required for this stage."
            exit 0
          fi

          echo "Installing compatibility system packages: ${packages[*]}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq "${packages[@]}"

      - name: Prepare locked voiceover and timing
        id: voice
        if: steps.request.outputs.mode == 'voice-prep'
        shell: bash
        env:
          JOB_ID: ${{ steps.request.outputs.job_id }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          GEMINI_API_KEYS_JSON: ${{ secrets.GEMINI_API_KEYS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/render-result"
          bash scripts/run-voice-prep.sh \
            jobs/request.json \
            private-source \
            "$RUNNER_TEMP/render-result" \
            >"$RUNNER_TEMP/private-voice.log" 2>&1
          code=$?
          cp "$RUNNER_TEMP/private-voice.log" "$RUNNER_TEMP/render-result/private-voice.log"
          printf '%s\n' "$code" > "$RUNNER_TEMP/render-result/exit-code.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "Private voiceover and exact forced-alignment package completed."
          else
            echo "Private voice preparation failed; preserving diagnostics."
          fi
          exit 0

      - name: Restore locked voiceover and timing
        id: audio_restore
        if: steps.request.outputs.mode == 'render' || steps.request.outputs.mode == 'render-sequence'
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          JOB_ID: ${{ steps.request.outputs.job_id }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/render-result"
          bash scripts/download-drive-audio.sh \
            private-source \
            "$JOB_ID" \
            >"$RUNNER_TEMP/private-audio-restore.log" 2>&1
          code=$?
          cp "$RUNNER_TEMP/private-audio-restore.log" "$RUNNER_TEMP/render-result/private-audio-restore.log"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "Restored the locked voice package for private rendering."
          else
            echo "Could not restore the locked voice package."
          fi
          exit 0

      - name: Render one private long-form sequence preview
        id: sequence
        if: >-
          steps.request.outputs.mode == 'render-sequence' &&
          steps.audio_restore.outputs.exit_code == '0'
        shell: bash
        env:
          JOB_ID: ${{ steps.request.outputs.job_id }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          SEQUENCE_INDEX: ${{ steps.request.outputs.sequence_index }}
        run: |
          set +e
          bash scripts/run-render-sequence.sh \
            jobs/request.json \
            private-source \
            "$RUNNER_TEMP/render-result" \
            >"$RUNNER_TEMP/private-sequence.log" 2>&1
          code=$?
          mkdir -p "$RUNNER_TEMP/render-result"
          cp "$RUNNER_TEMP/private-sequence.log" "$RUNNER_TEMP/render-result/private-sequence.log"
          printf '%s\n' "$code" > "$RUNNER_TEMP/render-result/sequence-exit-code.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "Private long-form sequence preview completed."
          else
            echo "Private long-form sequence preview failed; preserving diagnostics."
          fi
          exit 0

      - name: Render custom composition and build private review package
        id: render
        if: >-
          steps.request.outputs.mode == 'render' &&
          steps.audio_restore.outputs.exit_code == '0'
        shell: bash
        env:
          JOB_ID: ${{ steps.request.outputs.job_id }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set +e
          bash scripts/run-render.sh \
            jobs/request.json \
            private-source \
            "$RUNNER_TEMP/render-result" \
            >"$RUNNER_TEMP/private-build.log" 2>&1
          code=$?
          cp "$RUNNER_TEMP/private-build.log" "$RUNNER_TEMP/render-result/private-build.log"
          printf '%s\n' "$code" > "$RUNNER_TEMP/render-result/exit-code.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "Private custom render completed; running deterministic media QC."
          else
            echo "Private custom render failed; preserving the private diagnostic package."
          fi
          exit 0

      - name: Run deterministic media quality gate
        id: quality
        if: >-
          steps.request.outputs.mode == 'render' &&
          steps.render.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          node scripts/deterministic-quality-gate.mjs \
            "$RUNNER_TEMP/render-result" \
            private-source/automation/current/job.json \
            private-source/automation/config.json \
            >"$RUNNER_TEMP/private-quality.log" 2>&1
          code=$?
          cp "$RUNNER_TEMP/private-quality.log" "$RUNNER_TEMP/render-result/private-quality.log"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "Deterministic media QC passed; the render PR remains open for ChatGPT visual review."
          else
            echo "Deterministic media QC rejected the render."
            node - "$RUNNER_TEMP/render-result/quality-gate.json" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log(JSON.stringify({status: report.status, media: report.media, deterministicIssues: report.deterministicIssues}, null, 2));
          NODE
          fi
          exit 0

      - name: Refresh private checksums
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/render-result"
          find "$RUNNER_TEMP/render-result" -type f ! -name checksums.txt -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            > "$RUNNER_TEMP/render-result/checksums.txt"

      - name: Deliver private package to Google Drive
        id: drive
        if: always()
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          JOB_ID: ${{ steps.request.outputs.job_id }}
        run: |
          if bash scripts/upload-drive.sh \
            "$RUNNER_TEMP/render-result" \
            "$JOB_ID" \
            >"$RUNNER_TEMP/private-upload.log" 2>&1; then
            echo "Private Drive delivery completed."
          else
            echo "Private Drive delivery failed."
            tail -n 8 "$RUNNER_TEMP/private-upload.log" \
              | sed -E 's/(token|client_secret|refresh_token|access_token)[[:space:]]*=[[:space:]]*[^[:space:]]+/\1=[REDACTED]/Ig'
            exit 1
          fi

      - name: Remove private source checkout
        if: always()
        run: rm -rf private-source

      - name: Fail workflow when the requested stage failed
        if: >-
          always() &&
          (
            (
              steps.request.outputs.mode == 'voice-prep' &&
              (steps.voice.outputs.exit_code != '0' || steps.drive.outcome != 'success')
            ) ||
            (
              steps.request.outputs.mode == 'render-sequence' &&
              (
                steps.audio_restore.outputs.exit_code != '0' ||
                steps.sequence.outputs.exit_code != '0' ||
                steps.drive.outcome != 'success'
              )
            ) ||
            (
              steps.request.outputs.mode == 'render' &&
              (
                steps.audio_restore.outputs.exit_code != '0' ||
                steps.render.outputs.exit_code != '0' ||
                steps.quality.outputs.exit_code != '0' ||
                steps.drive.outcome != 'success'
              )
            )
          )
        run: |
          echo "The requested private voice, sequence preview, or full render stage failed. Private diagnostics were retained when possible."
          exit 1
