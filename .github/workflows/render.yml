name: Render private Remotion source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: read

concurrency:
  group: remotion-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'render/')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate render request
        id: request
        run: node scripts/validate-job.mjs jobs/request.json

      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rclone

      - name: Render and build private review package
        id: render
        shell: bash
        env:
          JOB_ID: ${{ steps.request.outputs.job_id }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          ELEVENLABS_API_KEYS_JSON: ${{ secrets.ELEVENLABS_API_KEYS_JSON }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/render-result"
          bash scripts/run-render.sh \
            jobs/request.json \
            private-source \
            "$RUNNER_TEMP/render-result" \
            >"$RUNNER_TEMP/private-build.log" 2>&1
          code=$?
          cp "$RUNNER_TEMP/private-build.log" "$RUNNER_TEMP/render-result/private-build.log"
          printf '%s\n' "$code" > "$RUNNER_TEMP/render-result/exit-code.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "Private render completed; uploading results."
          else
            echo "Private render failed; uploading the private diagnostic package."
          fi
          exit 0

      - name: Classify private failure safely
        if: always() && steps.render.outputs.exit_code != '0'
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/private-build.log" <<'PY'
          from pathlib import Path
          import re, sys
          text = Path(sys.argv[1]).read_text(errors="replace").lower()
          checks = [
              ("VOICE_NOT_FOUND", ["voice_not_found", "voice does not exist", "voice not found"]),
              ("VOICE_ACCESS_DENIED", ["voice_access_denied", "permission_rejected", "forbidden", "http 403"]),
              ("ELEVENLABS_AUTH", ["invalid_api_key", "credential_rejected", "http 401"]),
              ("ELEVENLABS_QUOTA", ["quota_exhausted", "quota_exceeded", "insufficient_credits", "http 402"]),
              ("ELEVENLABS_RATE_LIMIT", ["rate_limit", "http 429", "too many concurrent"]),
              ("VOICE_CONFIG_INVALID", ["voiceover config", "voiceid must", "voicename must"]),
              ("NARRATION_GENERATION", ["elevenlabs returned http", "could not generate", "text-to-speech"]),
              ("DEPENDENCY_OR_CHECK", ["npm err", "npm error", "error ts", "parsing error", "cannot find module"]),
              ("RENDER_FAILURE", ["render failed", "browser process crashed", "ffmpeg"]),
          ]
          result = "UNCLASSIFIED_PRIVATE_BUILD_FAILURE"
          for label, needles in checks:
              if any(needle in text for needle in needles):
                  result = label
                  break
          statuses = sorted(set(re.findall(r"http\s+(401|402|403|404|422|429|5\d\d)", text)))
          suffix = f" HTTP_{'_'.join(statuses)}" if statuses else ""
          print(f"PRIVATE_BUILD_CLASS={result}{suffix}")
          PY

      - name: Remove private source checkout
        if: always()
        run: rm -rf private-source

      - name: Upload privately to Google Drive
        if: always()
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          JOB_ID: ${{ steps.request.outputs.job_id }}
        run: |
          if bash scripts/upload-drive.sh \
            "$RUNNER_TEMP/render-result" \
            "$JOB_ID" \
            >"$RUNNER_TEMP/private-upload.log" 2>&1; then
            echo "Private Drive upload completed."
          else
            echo "Private Drive upload failed. Check the configured Drive secret."
            exit 1
          fi

      - name: Fail workflow when rendering failed
        if: always() && steps.render.outputs.exit_code != '0'
        run: |
          echo "The private render failed. Detailed diagnostics were uploaded to Drive."
          exit 1
