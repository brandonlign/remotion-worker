name: Cleanup private Duolingo render folder

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: read

concurrency:
  group: remotion-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'render/r260729-duo-hybrid-h9p3'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Remove audited Duolingo render folder
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -Eeuo pipefail
          target='r260729-duo-hybrid-h9p3'
          case "$target" in
            r260729-duo-hybrid-h9p3) ;;
            *) echo 'Refusing unexpected cleanup target.' >&2; exit 65 ;;
          esac

          config="$(mktemp)"
          trap 'rm -f "$config"' EXIT
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$config"
          chmod 600 "$config"

          rclone purge "gdrive:Telic-Renders/$target" \
            --config "$config" \
            --stats 0 \
            --log-level ERROR

          remaining="$(rclone lsf gdrive:Telic-Renders --dirs-only --config "$config" --stats 0 --log-level ERROR)"
          if grep -Fxq "$target/" <<<"$remaining"; then
            echo 'Temporary render folder still exists.' >&2
            exit 1
          fi

          echo 'Audited Duolingo render-folder cleanup completed.'
