name: Cleanup private Duolingo render folder

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json

permissions:
  contents: read

concurrency:
  group: remotion-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'render/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Remove exact audited Duolingo render folder
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -Eeuo pipefail
          JOB_ID="$(node -p "require('./jobs/request.json').jobId")"
          if [ "$JOB_ID" != "r260729-duo-simplify-c2m8" ]; then
            echo "Unexpected cleanup target." >&2
            exit 65
          fi
          if [ -z "${RCLONE_CONFIG_B64:-}" ]; then
            echo "Drive credentials are unavailable." >&2
            exit 65
          fi
          CONFIG="$(mktemp)"
          trap 'rm -f "$CONFIG"' EXIT
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$CONFIG"
          chmod 600 "$CONFIG"
          rclone purge "gdrive:Telic-Renders/$JOB_ID" \
            --config "$CONFIG" \
            --log-level ERROR || true
          if rclone lsf "gdrive:Telic-Renders" \
            --config "$CONFIG" \
            --dirs-only \
            --log-level ERROR | grep -Fxq "$JOB_ID/"; then
            echo "Cleanup target still exists." >&2
            exit 1
          fi
          echo "Audited render-folder cleanup completed."
