name: Validate Pragma AutoShort source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/request.json
      - .github/workflows/render.yml

permissions:
  contents: read

concurrency:
  group: pragma-style-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'render/pragma-style-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out validation harness
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate request
        id: request
        run: node scripts/validate-job.mjs jobs/request.json

      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Validate style contract and build
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/autopilot/prepare-render.mjs
          grep -q '"styleMode": "pragma"' automation/config.json
          grep -q 'PragmaAutoShort' src/compositions/AutoShort/AutoShortRouter.tsx
          grep -q 'styleMode' src/compositions/AutoShort/types.ts
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
          echo "Pragma and Telic AutoShort renderers compile successfully."

      - name: Remove private checkout
        if: always()
        run: rm -rf private-source
