name: Install Telic camera shutter SFX

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-telic-camera-shutter.yml

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Check out attributed public SFX source
        uses: actions/checkout@v4
        with:
          repository: Vincentwei1021/video-shotcraft
          ref: main
          path: public-sfx
          persist-credentials: false
          sparse-checkout: |
            assets/audio/sfx/camera/click-camera.mp3
            assets/audio/ATTRIBUTION.md
          sparse-checkout-cone-mode: false

      - name: Check out private registry only
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          sparse-checkout: config/telic-audio-library.json
          sparse-checkout-cone-mode: false

      - name: Cache public rclone binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/telic-tools/rclone-v1.75.0
          key: telic-rclone-v1.75.0-${{ runner.os }}-${{ runner.arch }}

      - name: Upload real shutter to private Telic SFX library
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -Eeuo pipefail
          source scripts/ensure-public-rclone.sh
          source_file="public-sfx/assets/audio/sfx/camera/click-camera.mp3"
          attribution="public-sfx/assets/audio/ATTRIBUTION.md"
          test -s "$source_file"
          grep -Fq 'Camera shutter click' "$attribution"
          grep -Fq '1133/1133-preview.mp3' "$attribution"

          folder_id="$(node -e "const x=require('./private-source/config/telic-audio-library.json'); process.stdout.write(x.folders.sfx.driveFolderId)")"
          test -n "$folder_id"

          cfg="$(mktemp)"
          trap 'rm -f "$cfg"; rm -rf private-source public-sfx' EXIT
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$cfg"
          chmod 600 "$cfg"
          rclone listremotes --config "$cfg" | grep -qx 'gdrive:'

          rclone copyto "$source_file" 'gdrive:02_camera_shutter.mp3' \
            --config "$cfg" \
            --drive-root-folder-id "$folder_id" \
            --log-level ERROR

          uploaded_size="$(rclone size 'gdrive:02_camera_shutter.mp3' --config "$cfg" --drive-root-folder-id "$folder_id" --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(String(j.bytes||0))})")"
          test "$uploaded_size" -gt 1000
          echo "Verified private Telic camera shutter upload."
