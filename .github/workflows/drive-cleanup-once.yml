name: One-off Telic render storage cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/drive-cleanup-once.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Cache public rclone binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/telic-tools/rclone-v1.75.0
          key: telic-rclone-v1.75.0-${{ runner.os }}-${{ runner.arch }}

      - name: Ensure rclone
        shell: bash
        run: |
          set -Eeuo pipefail
          source scripts/ensure-public-rclone.sh

      - name: Deep-clean remaining obsolete Telic render folders
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          KEEP_JOB: telic-manual-command-c5d13f6ca5d1fc052181
          TELIC_RENDERS_FOLDER_ID: 1PdQU0yfeiMtDqpXEueY1HtiM4bGvZpjm
        run: |
          set -Eeuo pipefail
          source scripts/lib/rclone-common.sh
          trap rclone_cleanup EXIT
          prepare_rclone_config "The Drive upload secret is not configured."
          validate_drive_file_scope

          # Absolute safety boundary: rclone's root is the verified
          # YouTube/Telic/Telic-Renders provider ID, not My Drive.
          set_drive_root "$TELIC_RENDERS_FOLDER_ID"

          rclone lsf gdrive: \
            --config "$RCLONE_CONFIG_FILE" \
            --dirs-only \
            --max-depth 1 \
            --log-level ERROR | sed 's:/$::' > "$RUNNER_TEMP/folders-before.txt"
          grep -Fxq "$KEEP_JOB" "$RUNNER_TEMP/folders-before.txt"

          echo "Remaining direct-child folders before deep cleanup:"
          cat "$RUNNER_TEMP/folders-before.txt"

          : > "$RUNNER_TEMP/blocked-after.txt"
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            [ "$name" = "$KEEP_JOB" ] && continue

            echo "Deep-cleaning legacy folder: $name"
            # Delete every file this Drive app is individually authorized to
            # delete. Unauthorized legacy children may remain; errors are
            # intentionally non-fatal so other files still get cleaned.
            set +e
            rclone delete "gdrive:$name" \
              --config "$RCLONE_CONFIG_FILE" \
              --retries 1 \
              --low-level-retries 1 \
              --rmdirs \
              --log-level ERROR
            set -e
            sleep 1

            # If the directory is now empty/removable, remove it too.
            set +e
            rclone purge "gdrive:$name" \
              --config "$RCLONE_CONFIG_FILE" \
              --retries 1 \
              --low-level-retries 1 \
              --log-level ERROR
            purge_code=$?
            set -e
            if [ "$purge_code" -ne 0 ]; then
              printf '%s\n' "$name" >> "$RUNNER_TEMP/blocked-after.txt"
            fi
            sleep 1
          done < "$RUNNER_TEMP/folders-before.txt"

          rclone lsf gdrive: \
            --config "$RCLONE_CONFIG_FILE" \
            --dirs-only \
            --max-depth 1 \
            --log-level ERROR | sed 's:/$::' > "$RUNNER_TEMP/folders-after.txt"
          grep -Fxq "$KEEP_JOB" "$RUNNER_TEMP/folders-after.txt"

          echo "Remaining direct-child folders after deep cleanup:"
          cat "$RUNNER_TEMP/folders-after.txt"
          echo "Remaining folder count: $(grep -c . "$RUNNER_TEMP/folders-after.txt" || true)"

          # Read-only size report for what remains inside the hard-scoped
          # Telic-Renders root. This cannot affect any Drive data.
          set +e
          rclone size gdrive: \
            --config "$RCLONE_CONFIG_FILE" \
            --json \
            --log-level ERROR > "$RUNNER_TEMP/remaining-size.json"
          size_code=$?
          set -e
          if [ "$size_code" -eq 0 ]; then
            echo "Remaining scoped size:"
            cat "$RUNNER_TEMP/remaining-size.json"
          fi
