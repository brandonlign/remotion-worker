name: One-off Telic render storage cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/drive-cleanup-once.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Cache public rclone binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/telic-tools/rclone-v1.75.0
          key: telic-rclone-v1.75.0-${{ runner.os }}-${{ runner.arch }}

      - name: Ensure rclone
        shell: bash
        run: |
          set -Eeuo pipefail
          source scripts/ensure-public-rclone.sh

      - name: Throttled cleanup of remaining obsolete Telic renders
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          KEEP_JOB: telic-manual-command-c5d13f6ca5d1fc052181
          TELIC_RENDERS_FOLDER_ID: 1PdQU0yfeiMtDqpXEueY1HtiM4bGvZpjm
        run: |
          set -Eeuo pipefail
          source scripts/lib/rclone-common.sh
          trap rclone_cleanup EXIT
          prepare_rclone_config "The Drive upload secret is not configured."
          validate_drive_file_scope

          # Hard safety boundary: all Drive operations are rooted at the exact
          # verified YouTube/Telic/Telic-Renders provider folder ID.
          set_drive_root "$TELIC_RENDERS_FOLDER_ID"

          common=(
            --config "$RCLONE_CONFIG_FILE"
            --checkers 1
            --transfers 1
            --tpslimit 1
            --tpslimit-burst 1
            --retries 2
            --low-level-retries 2
            --retries-sleep 5s
            --log-level ERROR
          )

          rclone lsf gdrive: "${common[@]}" --dirs-only --max-depth 1 \
            | sed 's:/$::' > "$RUNNER_TEMP/folders-before.txt"
          grep -Fxq "$KEEP_JOB" "$RUNNER_TEMP/folders-before.txt"

          echo "Scoped folders before cleanup:"
          cat "$RUNNER_TEMP/folders-before.txt"

          : > "$RUNNER_TEMP/still-blocked.txt"
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            [ "$name" = "$KEEP_JOB" ] && continue

            echo "Cleaning old render folder: $name"

            # First try one provider-side purge. This is cheap and removes the
            # whole obsolete folder when all descendants are writable.
            set +e
            rclone purge "gdrive:$name" "${common[@]}"
            purge_code=$?
            set -e
            if [ "$purge_code" -eq 0 ]; then
              echo "REMOVED: $name"
              sleep 3
              continue
            fi

            # If a legacy unauthorized child blocks purge, remove every
            # individually writable file slowly so API bursts cannot hide
            # cleanable content behind rate-limit errors.
            set +e
            rclone delete "gdrive:$name" "${common[@]}" --rmdirs
            set -e
            sleep 3

            set +e
            rclone purge "gdrive:$name" "${common[@]}"
            purge_code=$?
            set -e
            if [ "$purge_code" -eq 0 ]; then
              echo "REMOVED_AFTER_DEEP_CLEAN: $name"
            else
              printf '%s\n' "$name" >> "$RUNNER_TEMP/still-blocked.txt"
              echo "BLOCKED_BY_LEGACY_AUTH: $name"
            fi
            sleep 3
          done < "$RUNNER_TEMP/folders-before.txt"

          rclone lsf gdrive: "${common[@]}" --dirs-only --max-depth 1 \
            | sed 's:/$::' > "$RUNNER_TEMP/folders-after.txt"
          grep -Fxq "$KEEP_JOB" "$RUNNER_TEMP/folders-after.txt"

          echo "Scoped folders after cleanup:"
          cat "$RUNNER_TEMP/folders-after.txt"
          echo "Remaining direct-child folder count: $(grep -c . "$RUNNER_TEMP/folders-after.txt" || true)"
          echo "Legacy folders still blocked: $(grep -c . "$RUNNER_TEMP/still-blocked.txt" || true)"
          if [ -s "$RUNNER_TEMP/still-blocked.txt" ]; then
            cat "$RUNNER_TEMP/still-blocked.txt"
          fi

          rclone size gdrive: "${common[@]}" --json > "$RUNNER_TEMP/remaining-size.json"
          echo "Remaining scoped size:"
          cat "$RUNNER_TEMP/remaining-size.json"
