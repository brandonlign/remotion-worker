name: Temporary Coffee audio cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/coffee-audio-import.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JOB_ID: coffee-audio-import-20260816
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary private Drive staging
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -Eeuo pipefail
          source scripts/ensure-public-rclone.sh
          source scripts/lib/rclone-common.sh
          source scripts/lib/channel-storage.sh
          validate_job_id
          prepare_rclone_config "The Drive credential is not configured."
          trap rclone_cleanup EXIT
          ROOT="$(render_root_for_job_id "$JOB_ID")/$JOB_ID"
          rclone purge "gdrive:$ROOT" --config "$RCLONE_CONFIG_FILE" --stats 0 --log-level ERROR
          echo "Removed temporary Coffee audio staging."
