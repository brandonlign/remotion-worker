name: Sync professional Coffee audio library

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-coffee-audio.yml
      - scripts/sync-coffee-audio-library.sh

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Check out private source manifest
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Ensure transfer tools
        shell: bash
        run: |
          set -Eeuo pipefail
          source scripts/ensure-public-rclone.sh
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Ingest and verify approved Coffee audio
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -Eeuo pipefail
          bash scripts/sync-coffee-audio-library.sh \
            private-source/tools/telic-vnext/channels/coffee/audio-ingest.json

      - name: Remove private source checkout
        if: always()
        run: rm -rf private-source
