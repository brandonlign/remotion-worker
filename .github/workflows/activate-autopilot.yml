name: Activate Telic autopilot

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: telic-autopilot-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 210

    steps:
      - name: Launch one forced end-to-end Telic run
        id: launch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run autopilot.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f force=true

          run_id=""
          for attempt in $(seq 1 30); do
            runs_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow autopilot.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 20 \
              --json databaseId,createdAt)"
            run_id="$(printf '%s' "$runs_json" | jq -r --arg started "$started_at" '[.[] | select(.createdAt >= $started)] | first | .databaseId // empty')"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$run_id" ]; then
            echo "The forced Telic workflow run did not appear."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Launched forced Telic workflow run $run_id."

      - name: Require the full cloud pipeline to succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch "${{ steps.launch.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --compact --exit-status

      - name: Check out the latest private Telic source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ secrets.SOURCE_REPO_WRITE_TOKEN }}
          path: private-source
          persist-credentials: true
          fetch-depth: 0

      - name: Enable recurring production only after success
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main >/dev/null
          node - <<'NODE'
          const fs = require("node:fs");
          const path = "automation/config.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          if (config.enabled === true) {
            process.stdout.write("Telic autopilot was already enabled.\n");
            process.exit(0);
          }
          config.enabled = true;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

          if git diff --quiet -- automation/config.json; then
            exit 0
          fi
          git config user.name "telic-autopilot[bot]"
          git config user.email "telic-autopilot[bot]@users.noreply.github.com"
          git add automation/config.json
          git commit -m "Enable Telic autopilot after verified activation" >/dev/null
          git push origin HEAD:main >/dev/null
          echo "The recurring Telic schedule is now enabled."

      - name: Report activation
        run: |
          echo "Telic passed the forced research-to-publication run."
          echo "Recurring M/W/F production is enabled in the private source configuration."
