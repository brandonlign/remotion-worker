name: Export Telic Controller Source Privately

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/telic-controller-source-export.yml

permissions:
  contents: read

concurrency:
  group: telic-controller-source-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out private controller branch
        uses: actions/checkout@v4
        with:
          repository: brandonlign/remotion-video
          ref: agent/telic-controller-v3
          token: ${{ secrets.SOURCE_REPO_WRITE_TOKEN }}
          path: controller-repo
          persist-credentials: true
          fetch-depth: 0

      - name: Export archived source into the private branch
        working-directory: controller-repo
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="tools/telic-controller-v3/archive"
          inspection_dir="tools/telic-controller-v3/source-inspection"
          work="$RUNNER_TEMP/telic-controller-v3"

          rm -rf "$inspection_dir" "$work"
          mkdir -p "$inspection_dir" "$work"
          cat "$archive_dir"/chunk-*.b64 | base64 -d > "$work/controller.tar.gz"
          tar -xzf "$work/controller.tar.gz" -C "$inspection_dir"

          git config user.name "telic-controller-fix[bot]"
          git config user.email "telic-controller-fix[bot]@users.noreply.github.com"
          git add "$inspection_dir"
          if git diff --cached --quiet; then
            echo "Private controller source was already exported."
            exit 0
          fi
          git commit -m "Export Telic controller source for Studio fix"
          git push origin HEAD:agent/telic-controller-v3
