name: Worker CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out worker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce request-only render PR scope
        if: startsWith(github.head_ref, 'render/')
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf 'Render PR changed files:\n'
          printf '  %s\n' "${changed[@]}"

          if [ "${#changed[@]}" -lt 1 ] || [ "${#changed[@]}" -gt 2 ]; then
            echo "render/* PRs may change only the isolated worker request files." >&2
            exit 1
          fi

          has_render_request=false
          has_finalize_request=false
          for file in "${changed[@]}"; do
            case "$file" in
              jobs/request.json) has_render_request=true ;;
              jobs/finalize-request.json) has_finalize_request=true ;;
              *)
                echo "render/* PRs are request-only; reusable worker code must be committed and validated on main first." >&2
                exit 1
                ;;
            esac
          done

          if [ "$has_finalize_request" = true ]; then
            if [ "$has_render_request" != true ]; then
              echo "A finalize request must remain paired with the same job's canonical request.json." >&2
              exit 1
            fi
            node - jobs/request.json jobs/finalize-request.json <<'NODE'
          const fs = require("node:fs");
          const [renderPath, finalizePath] = process.argv.slice(2);
          const render = JSON.parse(fs.readFileSync(renderPath, "utf8"));
          const finalize = JSON.parse(fs.readFileSync(finalizePath, "utf8"));
          if (!render.jobId || render.jobId !== finalize.jobId) {
            throw new Error("request.json and finalize-request.json must belong to the exact same job.");
          }
          NODE
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate worker files
        run: npm run check
