name: Worker CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate worker files
        run: npm run check

  validate-private-autopilot:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out private autopilot branch
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: agent/telic-autopilot-v1
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate private source without public output
        shell: bash
        run: |
          if ! {
            npm ci --no-audit --no-fund &&
            node --check scripts/autopilot/generate-job.mjs &&
            node --check scripts/autopilot/prepare-render.mjs &&
            node --check scripts/autopilot/dispatch-render.mjs &&
            node --check scripts/autopilot/wait-for-worker.mjs &&
            node --check scripts/autopilot/record-result.mjs &&
            npm run lint;
          } >"$RUNNER_TEMP/private-validation.log" 2>&1; then
            rm -f "$RUNNER_TEMP/private-validation.log"
            echo "Private Telic validation failed; details were withheld from the public log."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/private-validation.log"
          echo "Private Telic autopilot passed syntax, lint, and type validation."
