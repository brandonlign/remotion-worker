name: Worker CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out worker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce request-only worker PR scope
        if: startsWith(github.head_ref, 'render/') || startsWith(github.head_ref, 'preview/')
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf 'Worker request PR changed files:\n'
          printf '  %s\n' "${changed[@]}"

          if [[ "$HEAD_REF" == preview/* ]]; then
            if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "jobs/preview-request.json" ]; then
              echo "preview/* PRs may change only jobs/preview-request.json." >&2
              exit 1
            fi
            branch_job_id="${HEAD_REF#preview/}"
            request_job_id="$(node -p "JSON.parse(require('fs').readFileSync('jobs/preview-request.json','utf8')).jobId || ''")"
            if [ -z "$branch_job_id" ] || [ "$request_job_id" != "$branch_job_id" ]; then
              echo "jobs/preview-request.json jobId must exactly match preview/<jobId>." >&2
              exit 1
            fi
            exit 0
          fi

          if [ "${#changed[@]}" -lt 1 ] || [ "${#changed[@]}" -gt 2 ]; then
            echo "render/* PRs may change only jobs/request.json and/or jobs/finalize-request.json." >&2
            exit 1
          fi

          has_render_request=false
          has_finalize_request=false
          for file in "${changed[@]}"; do
            case "$file" in
              jobs/request.json) has_render_request=true ;;
              jobs/finalize-request.json) has_finalize_request=true ;;
              *)
                echo "render/* PRs must never carry preview requests or reusable worker code." >&2
                exit 1
                ;;
            esac
          done

          branch_job_id="${HEAD_REF#render/}"
          if [ -z "$branch_job_id" ]; then
            echo "Worker render branch must be render/<jobId>." >&2
            exit 1
          fi
          if [ "$has_render_request" = true ]; then
            request_job_id="$(node -p "JSON.parse(require('fs').readFileSync('jobs/request.json','utf8')).jobId || ''")"
            [ "$request_job_id" = "$branch_job_id" ] || { echo "jobs/request.json jobId must match render/<jobId>." >&2; exit 1; }
          fi
          if [ "$has_finalize_request" = true ]; then
            finalize_job_id="$(node -p "JSON.parse(require('fs').readFileSync('jobs/finalize-request.json','utf8')).jobId || ''")"
            [ "$finalize_job_id" = "$branch_job_id" ] || { echo "jobs/finalize-request.json jobId must match render/<jobId>." >&2; exit 1; }
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate isolated worker request files
        if: startsWith(github.head_ref, 'render/') || startsWith(github.head_ref, 'preview/')
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_HEAD_REF" == preview/* ]]; then
            node scripts/validate-preview-job.mjs jobs/preview-request.json >/dev/null
            echo "Preview request validation passed."
            exit 0
          fi
          if [ -f jobs/request.json ]; then
            node scripts/validate-job.mjs jobs/request.json >/dev/null
          fi
          if [ -f jobs/finalize-request.json ]; then
            node scripts/validate-finalize-job.mjs jobs/finalize-request.json >/dev/null
          fi
          echo "Render/finalize request validation passed."

      - name: Validate worker files
        if: ${{ !startsWith(github.head_ref, 'render/') && !startsWith(github.head_ref, 'preview/') }}
        run: npm run check
