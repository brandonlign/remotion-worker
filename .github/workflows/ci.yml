name: Worker CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out worker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce request-only render PR scope
        if: startsWith(github.head_ref, 'render/')
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf 'Render PR changed files:\n'
          printf '  %s\n' "${changed[@]}"

          if [ "${#changed[@]}" -lt 1 ] || [ "${#changed[@]}" -gt 2 ]; then
            echo "render/* PRs may change only one or both isolated worker request files." >&2
            exit 1
          fi

          has_render_request=false
          has_finalize_request=false
          for file in "${changed[@]}"; do
            case "$file" in
              jobs/request.json) has_render_request=true ;;
              jobs/finalize-request.json) has_finalize_request=true ;;
              *)
                echo "render/* PRs are request-only; reusable worker code must be committed and validated on main first." >&2
                exit 1
                ;;
            esac
          done

          if [ "$has_render_request" != true ] && [ "$has_finalize_request" != true ]; then
            echo "render/* PRs must contain an isolated render or finalize request." >&2
            exit 1
          fi

          HAS_RENDER_REQUEST="$has_render_request" HAS_FINALIZE_REQUEST="$has_finalize_request" node - <<'NODE'
          const fs = require("node:fs");
          const branch = process.env.HEAD_REF || "";
          const prefix = "render/";
          if (!branch.startsWith(prefix) || branch.length <= prefix.length) {
            throw new Error("Worker request branch must be render/<jobId>.");
          }
          const branchJobId = branch.slice(prefix.length);
          let render = null;
          let finalize = null;
          if (process.env.HAS_RENDER_REQUEST === "true") {
            render = JSON.parse(fs.readFileSync("jobs/request.json", "utf8"));
            if (!render.jobId || render.jobId !== branchJobId) {
              throw new Error("jobs/request.json jobId must exactly match the render/<jobId> branch.");
            }
          }
          if (process.env.HAS_FINALIZE_REQUEST === "true") {
            finalize = JSON.parse(fs.readFileSync("jobs/finalize-request.json", "utf8"));
            if (!finalize.jobId || finalize.jobId !== branchJobId) {
              throw new Error("jobs/finalize-request.json jobId must exactly match the render/<jobId> branch.");
            }
          }
          if (render && finalize && render.jobId !== finalize.jobId) {
            throw new Error("Render and finalize requests must belong to the exact same job.");
          }
          NODE

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate worker files
        run: npm run check
