name: Source Refactor Check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-check.yml

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: 4769d8c6b95419187fef60da1367e3e2c9cdee08
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/tools/telic-vnext/package-lock.json

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install source dependencies
        working-directory: source
        run: |
          npm ci
          npm ci --prefix tools/telic-vnext

      - name: Run source gate
        working-directory: source
        run: npm run ci:check
