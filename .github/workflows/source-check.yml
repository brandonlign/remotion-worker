name: Source Migration Gate

on:
  push:
    branches: [diag/source-refactor-gate]

permissions:
  contents: read
  issues: write

jobs:
  source-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out migration harness
        uses: actions/checkout@v4
        with:
          ref: diag/source-refactor-gate
          path: harness

      - name: Check out private source main
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/tools/telic-vnext/package-lock.json

      - name: Install dependencies
        id: deps
        working-directory: source
        run: |
          set -o pipefail
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm ci 2>&1 | tee /tmp/deps-root.log
          npm ci --prefix tools/telic-vnext 2>&1 | tee /tmp/deps-vnext.log

      - name: Apply migration in checked-out source
        id: patch
        working-directory: source
        run: |
          set -o pipefail
          python3 ../harness/scripts/hifi-migrate.py 2>&1 | tee /tmp/patch.log
          python3 ../harness/scripts/hifi-post.py 2>&1 | tee -a /tmp/patch.log
          git diff --check
          git status --short
          if git grep -ni coffee -- tools/telic-vnext ':(exclude)tools/telic-vnext/node_modules/**'; then
            echo 'Coffee residue remains'; exit 1
          fi
          if git grep -niE 'espresso|grinder|brewing|cigar|roast' -- tools/telic-vnext/channels/hifi; then
            echo 'Copied non-HiFi editorial residue remains'; exit 1
          fi

      - name: Root CI
        id: root
        working-directory: source
        run: |
          set -o pipefail
          npm run ci:check 2>&1 | tee /tmp/root.log

      - name: Focused channel tests
        id: focused
        working-directory: source/tools/telic-vnext
        run: |
          set -o pipefail
          node --test test/hifi-channel-setup.test.mjs test/channel-registry.test.mjs test/universal-prompt-layering.test.mjs test/native-visual-plan-preflight.test.mjs test/youtube-channel-auth-helper.test.mjs 2>&1 | tee /tmp/focused.log

      - name: Full vNext suite and syntax
        id: vnext
        working-directory: source/tools/telic-vnext
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/vnext.log
          npm run test:syntax 2>&1 | tee /tmp/syntax.log

      - name: Commit validated migration to source main
        id: commit
        working-directory: source
        run: |
          git config user.name 'Telic Controller'
          git config user.email 'telic-controller@users.noreply.github.com'
          git add -A tools/telic-vnext
          git diff --cached --quiet && { echo 'Expected migration changes but found none'; exit 1; }
          git commit -m 'Replace Coffee with HiFi Studio channel'
          git push origin HEAD:main

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPS: ${{ steps.deps.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          ROOT: ${{ steps.root.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          VNEXT: ${{ steps.vnext.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
        run: |
          {
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "deps=$DEPS patch=$PATCH root=$ROOT focused=$FOCUSED vnext=$VNEXT commit=$COMMIT"
            for f in /tmp/patch.log /tmp/root.log /tmp/focused.log /tmp/vnext.log /tmp/syntax.log; do
              [ -f "$f" ] || continue
              echo; echo "===== $f ====="; tail -n 220 "$f"
            done
          } >/tmp/failure.txt
          gh issue create --repo "$GITHUB_REPOSITORY" --title "TEMP HiFi migration failure $GITHUB_RUN_ID" --body-file /tmp/failure.txt
