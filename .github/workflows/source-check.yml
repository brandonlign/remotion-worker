name: Source Refactor Check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-check.yml

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          repository: brandonlign/remotion-video
          ref: a03859862d3054e292a9ce1e7ea878816f2127ce
          path: source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/tools/telic-vnext/package-lock.json

      - name: Install source dependencies
        working-directory: source
        run: |
          npm ci
          npm ci --prefix tools/telic-vnext

      - name: Run source gate
        working-directory: source
        run: npm run ci:check
