name: Source Refactor Apply

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-check.yml

permissions:
  contents: read

jobs:
  source-refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out private source main
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/tools/telic-vnext/package-lock.json

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install source dependencies
        working-directory: source
        run: |
          npm ci
          npm ci --prefix tools/telic-vnext

      - name: Generalize native long-form preflights and fixtures
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('tools/telic-vnext/src/native-visual-plan-preflight.mjs')
          runtime = runtime_path.read_text()
          runtime_replacements = [
              (
                  "if (phase !== 'long_visual_plan' || job?.channelId !== 'telic' || job?.format !== 'long') return null;",
                  "if (phase !== 'long_visual_plan' || job?.format !== 'long') return null;",
                  1,
              ),
              (
                  "if (job?.channelId !== 'telic' || job?.format !== 'long') return null;",
                  "if (job?.format !== 'long') return null;",
                  2,
              ),
              (
                  "scripts/autopilot/prepare-telic-visual-plan.mjs",
                  "scripts/autopilot/prepare-long-visual-plan.mjs",
                  2,
              ),
              (
                  "scripts/autopilot/validate-telic-long-visuals.mjs",
                  "scripts/autopilot/validate-long-visuals.mjs",
                  1,
              ),
          ]
          for old, new, expected in runtime_replacements:
              count = runtime.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} runtime occurrence(s) of {old!r}, found {count}; refusing unsafe patch.')
              runtime = runtime.replace(old, new)
          runtime_path.write_text(runtime)

          test_path = Path('tools/telic-vnext/test/native-visual-plan-preflight.test.mjs')
          test = test_path.read_text()
          test_replacements = [
              (
                  "scripts/autopilot/prepare-telic-visual-plan.mjs",
                  "scripts/autopilot/prepare-long-visual-plan.mjs",
                  1,
              ),
              (
                  "validate-telic-long-visuals.mjs",
                  "validate-long-visuals.mjs",
                  1,
              ),
          ]
          for old, new, expected in test_replacements:
              count = test.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} fixture occurrence(s) of {old!r}, found {count}; refusing unsafe patch.')
              test = test.replace(old, new)
          test_path.write_text(test)
          PY
          git diff --check
          git diff -- tools/telic-vnext/src/native-visual-plan-preflight.mjs tools/telic-vnext/test/native-visual-plan-preflight.test.mjs

      - name: Source gate — root lint and script checks
        working-directory: source
        run: npm run lint

      - name: Source gate — vNext tests
        working-directory: source/tools/telic-vnext
        run: npm test

      - name: Source gate — vNext syntax
        working-directory: source/tools/telic-vnext
        run: npm run test:syntax

      - name: Commit validated source refactor to main
        working-directory: source
        run: |
          git config user.name "Telic Controller"
          git config user.email "telic-controller@users.noreply.github.com"
          git add tools/telic-vnext/src/native-visual-plan-preflight.mjs tools/telic-vnext/test/native-visual-plan-preflight.test.mjs
          git diff --cached --quiet && { echo "Expected native preflight changes but found none"; exit 1; }
          git commit -m "Generalize native long preflights across channels"
          git push origin HEAD:main

      # One-shot source mutation harness; remove after the validated push.
      # Triggered for another validation pass.
