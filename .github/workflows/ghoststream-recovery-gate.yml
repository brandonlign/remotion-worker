name: GhostStream recovery gate

on:
  pull_request:
    paths:
      - "ghoststream_runner/**"
      - ".github/workflows/ghoststream-recovery-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ghoststream_runner/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ghoststream_runner/requirements.txt

      - name: Run known-shower recovery gate
        run: python ghoststream_runner/run_gate.py | tee ghoststream_run.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-recovery-gate
          path: |
            ghoststream_results/
            ghoststream_run.log
          if-no-files-found: warn
