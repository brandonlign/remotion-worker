name: GhostStream recovery gate

on:
  pull_request:
    paths:
      - "ghoststream_runner/**"
      - ".github/workflows/ghoststream-recovery-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ghoststream_runner/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ghoststream_runner/requirements.txt

      - name: Run untouched multi-year confirmation
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_runner/multiyear_confirmation.py | tee ghoststream_multiyear_confirmation.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-multiyear-confirmation
          path: |
            ghoststream_multiyear_confirmation/
            ghoststream_multiyear_confirmation.log
          if-no-files-found: warn
