name: Validated Window07 evidence handoff

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - jobs/window07-evidence-handoff.json
      - .github/workflows/window07-evidence-handoff.yml

permissions:
  contents: read

concurrency:
  group: telic-window07-evidence-handoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  handoff:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'handoff/telic-197-window07-evidence-20260812'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const v = JSON.parse(fs.readFileSync('jobs/window07-evidence-handoff.json', 'utf8'));
          if (v.jobId !== 'telic-web-202608111952-159353') throw new Error('unexpected jobId');
          if (!/^[a-f0-9]{40}$/.test(String(v.sourceSha || ''))) throw new Error('invalid sourceSha');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `job_id=${v.jobId}\nsource_sha=${v.sourceSha}\n`);
          NODE

      - name: Check out exact private source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: agent/${{ steps.request.outputs.job_id }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Refuse stale source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C private-source rev-parse HEAD)" == "${{ steps.request.outputs.source_sha }}" ]] || {
            echo 'Private source advanced; refusing stale handoff.'
            exit 75
          }

      - name: Capture verified C602 Service Menu evidence
        shell: bash
        run: |
          set -euo pipefail
          capture_root="$RUNNER_TEMP/window07-capture"
          mkdir -p "$capture_root"
          npm install --silent --no-save --prefix "$capture_root" puppeteer-core@24
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$chrome" ]] || { echo 'No Chromium browser available.'; exit 1; }
          out="$capture_root/c602-service-menu.png"
          CAPTURE_ROOT="$capture_root" CHROME_BIN="$chrome" OUT_PATH="$out" node <<'NODE'
          const path = require('path');
          const puppeteer = require(path.join(process.env.CAPTURE_ROOT, 'node_modules', 'puppeteer-core'));
          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_BIN,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--disable-http2'],
            });
            try {
              const page = await browser.newPage();
              await page.setViewport({width: 1440, height: 1700, deviceScaleFactor: 2});
              await page.setUserAgent('Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36');
              await page.goto('https://www.manualslib.com/manual/1605591/Taylor-C602.html?page=20#manual', {
                waitUntil: 'domcontentloaded', timeout: 60000,
              });
              await page.waitForFunction(() => {
                const t = (document.body?.innerText || '').replace(/\s+/g, ' ');
                return t.includes('Service Menu option allows a trained service') && t.includes('critical operating');
              }, {timeout: 30000});
              const handle = await page.evaluateHandle(() => {
                const norm = (s) => String(s || '').replace(/\s+/g, ' ').trim();
                const matches = [...document.querySelectorAll('article, section, main, div, p')]
                  .map((el) => ({el, text: norm(el.innerText)}))
                  .filter(({el, text}) => {
                    const r = el.getBoundingClientRect();
                    return r.width > 280 && r.height > 35 &&
                      text.includes('Service Menu option allows a trained service') &&
                      text.includes('critical operating');
                  })
                  .sort((a, b) => a.text.length - b.text.length);
                return matches[0]?.el || null;
              });
              const element = handle.asElement();
              if (!element) throw new Error('verified Service Menu passage not found');
              await element.evaluate((el) => el.scrollIntoView({block: 'center'}));
              await new Promise((resolve) => setTimeout(resolve, 1000));
              await element.screenshot({path: process.env.OUT_PATH, type: 'png'});
            } finally {
              await browser.close();
            }
          })().catch((error) => { console.error(error.message); process.exit(1); });
          NODE
          test -s "$out"
          [[ "$(stat -c %s "$out")" -gt 15000 ]]
          file "$out" | grep -q 'PNG image data'

      - name: Patch Window07 to use real evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'private-source/src/compositions/CurrentLongForm/windows/Window07.tsx';
          let s = fs.readFileSync(p, 'utf8');
          const oldImport = 'import {AbsoluteFill, Easing, interpolate, useCurrentFrame} from "remotion";';
          const newImport = 'import {AbsoluteFill, Easing, Img, interpolate, staticFile, useCurrentFrame} from "remotion";';
          if (s.includes(oldImport)) s = s.replace(oldImport, newImport);
          if (!s.includes(newImport)) throw new Error('Window07 import contract changed');
          const startNeedle = '      <div\n        style={{\n          position: "absolute",\n          left: 1018,';
          const endNeedle = '      <div\n        style={{\n          position: "absolute",\n          left: move(frame, 318, 382, 1160, 1070),';
          const start = s.indexOf(startNeedle);
          const end = s.indexOf(endNeedle, start + 1);
          if (start < 0 || end <= start) throw new Error('Window07 evidence anchors changed');
          const replacement = `      <div\n        style={{\n          position: "absolute",\n          left: 1018,\n          top: 176,\n          width: 760,\n          height: 690,\n          opacity: evidenceIn * (1 - 0.72 * phraseLift),\n          transform: \`translateX(\${move(frame, 158, 220, 92, 0)}px)\`,\n          overflow: "hidden",\n          background: "#FFFFFF",\n          border: \`2px solid \${RULE}\`,\n          boxShadow: "0 18px 50px rgba(23,23,23,0.10)",\n        }}\n      >\n        <Img\n          src={staticFile("assets/current/evidence/c602-service-menu.png")}\n          style={{width: "100%", height: "100%", objectFit: "contain", background: "#FFFFFF"}}\n        />\n        <div\n          style={{\n            position: "absolute", left: 22, bottom: 18, padding: "9px 13px",\n            background: "rgba(244,240,232,0.94)", border: \`1px solid \${RULE}\`,\n            fontSize: 17, fontWeight: 900, letterSpacing: 0.6, color: MUTED,\n          }}\n        >\n          Taylor C602 Service Manual · page 20 · ManualsLib\n        </div>\n      </div>\n\n`;
          s = s.slice(0, start) + replacement + s.slice(end);
          const obsoleteProof = '  const proof = fade(frame, 218, 270);\n';
          if (!s.includes(obsoleteProof)) throw new Error('Window07 proof anchor changed');
          s = s.replace(obsoleteProof, '');
          if (s.includes('SOURCE TRANSCRIPT') || s.includes('Transcribed from the verified Taylor service-manual source')) {
            throw new Error('simulated transcript evidence remains');
          }
          if (!s.includes('c602-service-menu.png')) throw new Error('local evidence path missing');
          fs.writeFileSync(p, s);
          NODE

      - name: Validate patched Window07
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          npm ci --silent
          npx eslint src/compositions/CurrentLongForm/windows/Window07.tsx
          npx tsc --noEmit

      - name: Prepare private handoff
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/window07-handoff"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/window07-capture/c602-service-menu.png" "$out/c602-service-menu.png"
          cp private-source/src/compositions/CurrentLongForm/windows/Window07.tsx "$out/Window07.tsx"
          printf '%s\n' '${{ steps.request.outputs.source_sha }}' > "$out/source-sha.txt"
          sha256sum "$out/c602-service-menu.png" "$out/Window07.tsx" > "$out/checksums.txt"

      - name: Deliver validated handoff privately to Drive
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          JOB_ID: ${{ steps.request.outputs.job_id }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          source scripts/lib/rclone-common.sh
          trap rclone_cleanup EXIT
          validate_job_id
          prepare_rclone_config 'Drive upload credential is unavailable.'
          use_telic_renders_root
          rclone copy "$RUNNER_TEMP/window07-handoff" "gdrive:$JOB_ID/window07-validated-handoff" --config "$RCLONE_CONFIG_FILE" --log-level ERROR
          echo 'Validated Window07 handoff delivered privately.'

      - name: Cleanup
        if: always()
        run: rm -rf private-source "$RUNNER_TEMP/window07-capture" "$RUNNER_TEMP/window07-handoff"
