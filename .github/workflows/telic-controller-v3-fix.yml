name: Fix Telic Controller Studio Publishing

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/telic-controller-v3-fix.yml
      - telic-controller-fix/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telic-controller-v3-fix
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out worker harness
        uses: actions/checkout@v4

      - name: Check out private controller source
        uses: actions/checkout@v4
        with:
          repository: brandonlign/remotion-video
          ref: agent/telic-controller-v3
          token: ${{ secrets.SOURCE_REPO_WRITE_TOKEN }}
          path: controller-repo
          persist-credentials: false
          fetch-depth: 1

      - name: Reassemble and inspect controller
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="controller-repo/tools/telic-controller-v3/archive"
          work="$RUNNER_TEMP/telic-controller-v3"
          mkdir -p "$work/extracted"
          cat "$archive_dir"/chunk-*.b64 | base64 -d > "$work/controller.tar.gz"
          tar -xzf "$work/controller.tar.gz" -C "$work/extracted"

          find "$work/extracted" -type f -printf '%P\n' | sort > "$work/file-list.txt"
          grep -RInE \
            'google-token|google-client|google-authorize|Authorized YouTube|YouTube channel|youtube studio|YouTube Studio|studio.youtube|upload|doctor|ARMED|cdp|debugging' \
            "$work/extracted" > "$work/relevant-lines.txt" || true

          tar -czf "$work/extracted-source.tar.gz" -C "$work/extracted" .

      - name: Upload inspection source
        uses: actions/upload-artifact@v4
        with:
          name: telic-controller-v3-source
          path: |
            ${{ runner.temp }}/telic-controller-v3/file-list.txt
            ${{ runner.temp }}/telic-controller-v3/relevant-lines.txt
            ${{ runner.temp }}/telic-controller-v3/extracted-source.tar.gz
          if-no-files-found: error
          retention-days: 1
