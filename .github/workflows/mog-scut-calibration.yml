name: Mog SCUT calibration

on:
  pull_request:
    paths:
      - scripts/calibrate_mog_scut.py
      - .github/workflows/mog-scut-calibration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mog-scut-calibration

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install calibration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==1.26.4 \
            scipy==1.14.1 \
            scikit-learn==1.5.2 \
            opencv-python-headless==4.10.0.84 \
            mediapipe==0.10.21 \
            gdown==5.2.0

      - name: Download official labels and SCUT-FBP5500 images
        run: |
          git clone --depth 1 https://github.com/HCIILAB/SCUT-FBP5500-Database-Release.git official-scut
          gdown --fuzzy "https://drive.google.com/file/d/1w0TorBfTIqbquQVd6k3h_77ypnrvfGwf/view" -O scut-fbp5500.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile
          archive = Path("scut-fbp5500.zip")
          print(f"Downloaded {archive.stat().st_size:,} bytes")
          if not zipfile.is_zipfile(archive):
              raise SystemExit("SCUT download is not a valid ZIP archive")
          with zipfile.ZipFile(archive) as zipped:
              zipped.extractall("scut-dataset")
              print(f"Extracted {len(zipped.infolist())} entries")
          PY

      - name: Calibrate and cross-validate benchmark model
        run: |
          python scripts/calibrate_mog_scut.py \
            --dataset-root scut-dataset \
            --official-repo official-scut \
            --output artifacts/mog-scut-calibration.json

      - name: Publish calibration artifact to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/mog-scut-calibration.json artifacts/mog-scut-calibration.md
          if git diff --cached --quiet; then
            echo "Calibration artifact unchanged"
          else
            git commit -m "Add Mog SCUT calibration results"
            git push origin HEAD:agent/mog-scut-calibration
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mog-scut-calibration
          path: |
            artifacts/mog-scut-calibration.json
            artifacts/mog-scut-calibration.md
          if-no-files-found: error
