name: Validate packaged long-form source

on:
  push:
    branches:
      - render/telic-web-202608111952-159353
    paths:
      - .github/workflows/validate-package.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out candidate private source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: 694e99d89f0ab2e62ee66b81260156a14438a523
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Install restore dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Restore locked voice package
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: bash scripts/download-drive-audio.sh private-source telic-web-202608111952-159353

      - name: Validate metadata chapters and placeholders
        working-directory: private-source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const readJson = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const job = readJson('automation/current/job.json');
          const yt = readJson('automation/current/youtube.json');
          const composition = readJson('automation/current/composition.json');
          const runtime = readJson('automation/current/audio-runtime.json');
          const same = (name, a, b) => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${name} mismatch`); };
          same('jobId', job.jobId, yt.jobId);
          same('publishAt', job.publishAt, yt.publishAt);
          same('title', job.title, yt.title);
          same('description', job.description, yt.description);
          same('tags', job.tags, yt.tags);
          const expectedDefaults = {privacyStatus:'private',madeForKids:false,containsSyntheticMedia:false,categoryId:'28',defaultLanguage:'en',license:'youtube'};
          for (const [k,v] of Object.entries(expectedDefaults)) if (yt[k] !== v) throw new Error(`YouTube default ${k} mismatch`);
          if (composition.thumbnailAuthored !== true || composition.thumbnailCompositionId !== 'LongFormThumbnail') throw new Error('thumbnail composition metadata incomplete');
          for (const required of ['src/compositions/CurrentLongForm/Composition.tsx','src/compositions/CurrentLongForm/Thumbnail.tsx']) if (!composition.sourceFiles?.includes(required)) throw new Error(`sourceFiles missing ${required}`);
          const thumbnail = fs.readFileSync('src/compositions/CurrentLongForm/Thumbnail.tsx','utf8');
          if (/TELIC_LONGFORM_THUMBNAIL_PLACEHOLDER|thumbnail placeholder/i.test(thumbnail)) throw new Error('thumbnail placeholder remains');
          if (thumbnail.length < 180) throw new Error('thumbnail source is too small');
          for (let i = 1; i <= 17; i++) {
            const p = `src/compositions/CurrentLongForm/windows/Window${String(i).padStart(2,'0')}.tsx`;
            const text = fs.readFileSync(p,'utf8');
            if (text.includes('TELIC_LONG_WINDOW_PLACEHOLDER')) throw new Error(`placeholder remains in ${p}`);
          }
          const chapterLines = job.description.split('\n').filter((line) => /^\d{2}:\d{2}\s/.test(line));
          if (chapterLines.length < 3 || chapterLines.length > 10) throw new Error(`chapter count invalid: ${chapterLines.length}`);
          const chapterSeconds = chapterLines.map((line) => { const [m,s] = line.slice(0,5).split(':').map(Number); return m*60+s; });
          if (chapterSeconds[0] !== 0) throw new Error('first chapter must be 00:00');
          for (let i=1;i<chapterSeconds.length;i++) if (chapterSeconds[i] <= chapterSeconds[i-1] || chapterSeconds[i]-chapterSeconds[i-1] < 10) throw new Error('chapter timestamps are not strictly ascending with >=10s spacing');
          const durationSeconds = Number(runtime.durationSeconds ?? composition.durationSeconds);
          if (!Number.isFinite(durationSeconds) || chapterSeconds.at(-1) >= durationSeconds) throw new Error('last chapter exceeds locked runtime');
          console.log(`Metadata/chapter/placeholder validation passed: ${chapterLines.length} chapters within ${durationSeconds.toFixed(3)}s.`);
          NODE

      - name: Install source dependencies
        working-directory: private-source
        run: npm ci --no-audit --no-fund

      - name: Run strict long-form production preparation
        working-directory: private-source
        run: npm run long:prepare

      - name: Run lint type and source contracts
        working-directory: private-source
        run: npm run lint

      - name: Render final thumbnail still only
        working-directory: private-source
        run: ./node_modules/.bin/remotion still src/index.ts LongFormThumbnail "$RUNNER_TEMP/long-thumbnail.png" --log=error

      - name: Upload thumbnail validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: telic-longform-thumbnail-validation
          path: ${{ runner.temp }}/long-thumbnail.png
          if-no-files-found: error
