name: GhostStream novel search

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  april-specification-curve:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ghoststream_novel/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ghoststream_novel/requirements.txt

      - name: Run frozen 81-cell threshold grid
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_novel/specification_curve_april.py | tee ghoststream_april_specification_curve.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-april-specification-curve
          path: |
            ghoststream_april_specification_curve/
            ghoststream_april_specification_curve.log
          if-no-files-found: warn
