name: GhostStream novel search

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mdc-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.15.0

      - name: Inspect MDC downloads
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_novel/inspect_mdc_download_links.py | tee ghoststream_mdc_links.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-mdc-links
          path: ghoststream_mdc_links.log
          if-no-files-found: error
