name: GhostStream novel search

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-shober-edmond:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install numpy==2.3.2 pandas==2.3.1 scipy==1.16.1 requests==2.32.5

      - name: Run frozen external validation
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_novel/run_validate_shober_edmond_standalone.py | tee ghoststream_shober_edmond_validation.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-shober-edmond-validation
          path: |
            ghoststream_shober_edmond_validation/
            ghoststream_shober_edmond_validation.log
          if-no-files-found: warn
