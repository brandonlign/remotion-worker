name: GhostStream novel search

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-independent-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ghoststream_novel/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ghoststream_novel/requirements.txt

      - name: Inspect independent catalog archives
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_novel/inspect_independent_archives.py | tee ghoststream_independent_schemas.log

      - name: Upload schema log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-independent-schemas
          path: ghoststream_independent_schemas.log
          if-no-files-found: error
