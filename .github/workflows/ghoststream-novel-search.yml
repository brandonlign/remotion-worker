name: GhostStream novel search

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-year-search:
    strategy:
      fail-fast: false
      matrix:
        month: [1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ghoststream_novel/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ghoststream_novel/requirements.txt

      - name: Run current-year monthly search
        shell: bash
        env:
          GHOSTSTREAM_YEAR: "2026"
          GHOSTSTREAM_MONTH: ${{ matrix.month }}
        run: |
          set -o pipefail
          python ghoststream_novel/run_month_year_v3.py | tee ghoststream_2026_${GHOSTSTREAM_MONTH}.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-2026-v3-${{ matrix.month }}
          path: |
            ghoststream_novel_results/
            ghoststream_2026_${{ matrix.month }}.log
          if-no-files-found: warn
