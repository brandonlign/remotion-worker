name: GhostStream novel search

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-edmond-2024:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.15.0

      - name: Resolve and validate official EDMOND archive
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_novel/resolve_edmond_2024.py | tee ghoststream_edmond_resolver.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-edmond-2024-resolution
          path: |
            ghoststream_edmond_resolver/
            ghoststream_edmond_resolver.log
          if-no-files-found: warn
