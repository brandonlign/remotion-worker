name: GhostStream novel search

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mdc-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install requests
        run: python -m pip install requests==2.32.5

      - name: Inspect checker
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_novel/inspect_mdc_checker.py | tee ghoststream_mdc_checker.log

      - name: Upload files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-mdc-checker
          path: |
            mdc_checker/
            ghoststream_mdc_checker.log
          if-no-files-found: warn
