name: GhostStream novel search

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cams-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ghoststream_novel/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ghoststream_novel/requirements.txt

      - name: Validate frozen stream in legacy CAMS
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_novel/validate_cams_legacy.py | tee ghoststream_cams_validation.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-cams-validation
          path: |
            ghoststream_cams_validation/
            ghoststream_cams_validation.log
          if-no-files-found: warn
