name: GhostStream novel search

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  novel-search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ghoststream_novel/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ghoststream_novel/requirements.txt

      - name: Run all-season novel search
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_novel/run_novel_search_fixed.py | tee ghoststream_novel_search.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-novel-search
          path: |
            ghoststream_novel_results/
            ghoststream_novel_search.log
          if-no-files-found: warn
