name: OrbitTrace Denis review package

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-review-package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ghoststream_novel/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r ghoststream_novel/requirements.txt
          python -m pip install matplotlib==3.7.5 pillow==10.4.0

      - name: Build OrbitTrace review package
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_novel/build_orbittrace_denis_package.py | tee orbittrace_denis_package.log

      - name: Upload review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-denis-review-package
          path: |
            orbittrace_denis_package/
            orbittrace_denis_package.log
          if-no-files-found: warn
