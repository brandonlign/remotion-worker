name: GhostStream novel search

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  april-bootstrap-uncertainty:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ghoststream_novel/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ghoststream_novel/requirements.txt

      - name: Run 20,000-replicate year-night bootstraps
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_novel/bootstrap_april_solution.py | tee ghoststream_april_bootstrap.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-april-bootstrap
          path: |
            ghoststream_april_bootstrap/
            ghoststream_april_bootstrap.log
          if-no-files-found: warn
