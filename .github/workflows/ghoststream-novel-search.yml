name: GhostStream novel search

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-catalog-validation-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ghoststream_novel/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ghoststream_novel/requirements.txt

      - name: Validate permanent SonotaCo and EDMOND archives
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_novel/validate_independent_catalogs_v2.py | tee ghoststream_independent_validation_v2.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-independent-validation-v2
          path: |
            ghoststream_independent_validation/
            ghoststream_independent_validation_v2.log
          if-no-files-found: warn
