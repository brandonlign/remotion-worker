name: GhostStream novel search

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-archive-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ghoststream_novel/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ghoststream_novel/requirements.txt

      - name: Inspect permanent archives
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_novel/inspect_archive_versions.py | tee ghoststream_archive_versions.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-archive-versions
          path: ghoststream_archive_versions.log
          if-no-files-found: error
