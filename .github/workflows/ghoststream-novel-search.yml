name: GhostStream novel search

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-edmond-web-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.15.0

      - name: Resolve annual or Q2 archive
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_novel/resolve_edmond_archives.py | tee ghoststream_edmond_archive_resolution.log

      - name: Upload resolution audit and recovered archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-edmond-archive-resolution
          path: |
            ghoststream_edmond_archive_resolution/
            ghoststream_edmond_archive_resolution.log
          if-no-files-found: warn
