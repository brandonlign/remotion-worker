name: GhostStream novel search

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mdc-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install requests
        run: python -m pip install requests==2.32.5

      - name: Fetch current MDC templates
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_novel/fetch_mdc_templates.py | tee ghoststream_mdc_templates.log

      - name: Upload templates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-mdc-templates
          path: |
            ghoststream_mdc_templates/
            ghoststream_mdc_templates.log
          if-no-files-found: warn
