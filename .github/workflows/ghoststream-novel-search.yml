name: GhostStream novel search

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-zero-speed-synthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ghoststream_novel/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ghoststream_novel/requirements.txt

      - name: Run uniform zero-speed-drift synthesis
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_novel/synthesize_all_external_archives_zero_speed.py | tee ghoststream_all_external_zero_speed.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-all-external-zero-speed
          path: |
            ghoststream_all_external_zero_speed/
            ghoststream_all_external_zero_speed.log
          if-no-files-found: warn
