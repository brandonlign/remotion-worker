name: GhostStream novel search

on:
  pull_request:
    paths:
      - "ghoststream_novel/**"
      - ".github/workflows/ghoststream-novel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-shober-edmond:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pandas==2.3.1 requests==2.32.5

      - name: Download, verify, and inspect subset
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_novel/inspect_shober_edmond.py | tee ghoststream_shober_edmond_inspection.log

      - name: Upload inspection and source file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-shober-edmond-inspection
          path: |
            ghoststream_shober_edmond_inspection/
            ghoststream_shober_edmond_inspection.log
          if-no-files-found: warn
